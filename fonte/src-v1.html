<title>Central M&amp;O</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F0EF;--surface:#FBFAF8;--surface-2:#E9E6E2;--hover:rgba(34,40,49,.05);--line:#E2DBD0;--line-strong:#D3C5AE;
  --text:#222831;--text-2:#454A52;--text-3:#6A655D;
  --primary:#222831;--on-primary:#F4EBDD;--focus:#948979;--taupe:#948979;
  --side-bg:#222831;--side-text:#C9C2B6;--side-strong:#F2F0EF;--side-hover:#2B313A;--side-active:#393E46;--side-line:#2B313A;--side-label:#A8A195;
  --logo-c:#222831;--logo-m:#DFD0B8;--logo-w:#222831;
  --st-neu:#51565D;--st-neu-bg:#E6E3DF;--st-prog:#58488A;--st-prog-bg:#E7E2F1;--st-cli:#2D5A83;--st-cli-bg:#DFE8F1;
  --st-adj:#7E5410;--st-adj-bg:#F4E6CC;--st-ok:#2E6844;--st-ok-bg:#DCEBE0;--st-late:#9A3B2E;--st-late-bg:#F5E1DC;
  --toast-bg:#222831;--toast-fg:#F2F0EF;--toast-act:#DFD0B8;
  --scrim:rgba(24,28,34,.45);--media-bg:#1B2027;
  --shadow:0 1px 2px rgba(34,40,49,.06),0 12px 32px rgba(34,40,49,.12);
  --shadow-sm:0 1px 2px rgba(34,40,49,.07);
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222831;--surface:#2A3039;--surface-2:#343A43;--hover:rgba(242,240,239,.05);--line:#363C45;--line-strong:#48505A;
  --text:#F2F0EF;--text-2:#DFD0B8;--text-3:#ABA497;
  --primary:#DFD0B8;--on-primary:#222831;--focus:#DFD0B8;
  --side-bg:#1B2027;--side-hover:#252B33;--side-active:#2F353E;--side-line:#262C34;
  --logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF;
  --st-neu:#CBC6BE;--st-neu-bg:#3A3F47;--st-prog:#C8BBEE;--st-prog-bg:#382F4E;--st-cli:#A3C4E6;--st-cli-bg:#29394B;
  --st-adj:#EAC47F;--st-adj-bg:#463A25;--st-ok:#A3D4B3;--st-ok-bg:#27402F;--st-late:#F2AE9F;--st-late-bg:#4A2F2C;
  --toast-bg:#F2F0EF;--toast-fg:#222831;--toast-act:#393E46;
  --scrim:rgba(0,0,0,.55);--media-bg:#15191F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#222831;--surface:#2A3039;--surface-2:#343A43;--hover:rgba(242,240,239,.05);--line:#363C45;--line-strong:#48505A;
  --text:#F2F0EF;--text-2:#DFD0B8;--text-3:#ABA497;
  --primary:#DFD0B8;--on-primary:#222831;--focus:#DFD0B8;
  --side-bg:#1B2027;--side-hover:#252B33;--side-active:#2F353E;--side-line:#262C34;
  --logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF;
  --st-neu:#CBC6BE;--st-neu-bg:#3A3F47;--st-prog:#C8BBEE;--st-prog-bg:#382F4E;--st-cli:#A3C4E6;--st-cli-bg:#29394B;
  --st-adj:#EAC47F;--st-adj-bg:#463A25;--st-ok:#A3D4B3;--st-ok-bg:#27402F;--st-late:#F2AE9F;--st-late-bg:#4A2F2C;
  --toast-bg:#F2F0EF;--toast-fg:#222831;--toast-act:#393E46;
  --scrim:rgba(0,0,0,.55);--media-bg:#15191F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-3)}
.tnum{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.logo{display:inline-block;line-height:0;flex:none}
.logo svg{display:block;height:100%;width:auto}
.logo .lc{fill:var(--logo-c)}.logo .lm{fill:var(--logo-m)}.logo .lw{fill:var(--logo-w)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.lg{height:48px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--st-late)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:500;color:var(--text-2)}
.inp,.sel,.ta{width:100%;height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
.ta{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.7}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--st-neu-bg);color:var(--st-neu)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-prog{background:var(--st-prog-bg);color:var(--st-prog)}
.t-cli{background:var(--st-cli-bg);color:var(--st-cli)}
.t-adj{background:var(--st-adj-bg);color:var(--st-adj)}
.t-ok{background:var(--st-ok-bg);color:var(--st-ok)}
.t-late{background:var(--st-late-bg);color:var(--st-late)}
.t-done::before{width:7px;height:4px;border-radius:0;background:none;border-left:1.5px solid;border-bottom:1.5px solid;transform:rotate(-45deg) translate(1px,-1px)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;border:1px solid var(--line-strong);font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--text-2);white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font:600 10px/1 var(--mono);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.av.lg{width:40px;height:40px;font-size:13px}
.cmark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--logo-c);color:var(--logo-m);font:600 9px/1 var(--mono)}
.cmark svg{width:100%;height:100%;display:block}
.cmark .lc{fill:var(--logo-c)}.cmark .lm{fill:var(--logo-m)}
.cmark.lg{width:44px;height:44px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.due{font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--st-late);font-weight:500}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-3);display:grid;place-items:center;background:none;flex:none;padding:0;color:var(--surface);transition:background .12s}
.chk:hover{border-color:var(--text)}
.chk.on{background:var(--st-ok);border-color:var(--st-ok)}
.chk.sq{border-radius:5px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--taupe)}
.bar>i.late{background:var(--st-late)}
.empty{padding:28px 16px;text-align:center;color:var(--text-3);font-size:13px}

/* ---------- login ---------- */
.login{min-height:100%;background:#222831;color:#F2F0EF;display:grid;place-items:center;padding:40px 16px;--logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF}
.login-box{width:min(460px,100%);display:flex;flex-direction:column;gap:28px}
.login .logo{height:30px}
.login h1{font-size:30px;line-height:1.15}
.login p.lead{color:#C9C2B6;font-size:15px;margin-top:10px}
.login form{display:flex;gap:8px}
.login .inp{background:#2A3039;border-color:#48505A;color:#F2F0EF;height:44px}
.login .btn.pri{background:#DFD0B8;color:#222831;border-color:#DFD0B8;height:44px}
.login .sent{color:#C9C2B6;font-size:13px}
.login .label{color:#A8A195}
.roles{display:flex;flex-direction:column;gap:8px}
.role{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid #393E46;background:#2A3039;text-align:left;color:#F2F0EF;width:100%;transition:border-color .12s,background .12s}
.role:hover{border-color:#DFD0B8;background:#2F353E}
.role b{display:block;font-weight:600;font-size:15px}
.role small{display:block;color:#C9C2B6;font-size:13px;margin-top:2px}
.role .lvl{margin-left:auto;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#DFD0B8;border:1px solid #48505A;border-radius:6px;padding:4px 7px;white-space:nowrap}
.role .av{background:#393E46;color:#DFD0B8;border-color:#48505A}
.login .foot{font-size:12px;color:#A8A195}

/* ---------- casca do time ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.side{background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;gap:2px;padding:16px 10px 12px;overflow-y:auto;--logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF}
.side .logo{height:22px;margin:2px 10px 16px;display:block}
.nav{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 10px;border-radius:8px;color:var(--side-text);border:0;background:none;width:100%;text-align:left;font-size:14px}
.nav:hover{background:var(--side-hover);color:var(--side-strong)}
.nav.on{background:var(--side-active);color:var(--side-strong);font-weight:500}
.nav .n{margin-left:auto;font:500 11px/1 var(--mono);color:#222831;background:#DFD0B8;border-radius:10px;padding:3px 6px}
.nav .n.soft{background:transparent;color:var(--side-label);padding:0}
.search-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--side-line);background:rgba(255,255,255,.03);color:var(--side-text);font-size:13px;width:100%;text-align:left}
.search-btn:hover{border-color:#48505A;color:var(--side-strong)}
.search-btn kbd{margin-left:auto}
.side-label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--side-label);padding:18px 10px 8px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:6px 10px}
.me .av{background:#393E46;color:#DFD0B8;border-color:#48505A}
.me b{display:block;color:var(--side-strong);font-weight:500;font-size:13px}
.me small{display:block;color:var(--side-label);font-size:12px}
.proto{font-size:11px;color:var(--side-label);padding:2px 10px 0;line-height:1.4}
.main{height:100%;overflow-y:auto;min-width:0;position:relative}
.topbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--side-bg);color:var(--side-strong);position:sticky;top:0;z-index:20;--logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF}
.topbar .logo{height:18px}
.topbar .btn{color:var(--side-strong);border-color:transparent;background:transparent}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 72px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{font-size:24px;line-height:1.2}
.phead .sub{color:var(--text-3);margin-top:4px}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.scrim-side{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:284px;z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim-side{display:block;position:fixed;inset:0;background:var(--scrim);z-index:44}
  .topbar{display:flex}
  .page{padding:20px 16px 88px;gap:20px}
  .phead h1{font-size:21px}
}

/* ---------- listas e seções ---------- */
.sec{display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;align-items:center;gap:10px;padding:0 4px 4px}
.sec-h h2{font-size:15px}
.sec-h .c{font:500 12px var(--mono);color:var(--text-3)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;min-width:0}
.row:hover{background:var(--hover)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{color:var(--text-3);text-decoration:line-through}
.row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.cchip .cmark{width:16px;height:16px;font-size:7px}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.quick input{flex:1;border:0;background:none;height:34px;min-width:0}
.quick input:focus{outline:none}
.quick .sel{width:auto;height:30px;font-size:13px;border-color:var(--line)}
.callback{border:1px solid var(--st-adj-bg);background:color-mix(in srgb,var(--st-adj-bg) 45%,var(--surface));border-radius:12px;padding:4px}
.quote{font-size:13px;color:var(--text-2);border-radius:6px;background:var(--surface-2);padding:6px 9px;margin-top:4px}

/* visão geral */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat b{font:600 26px/1 var(--sans);font-variant-numeric:tabular-nums}
.stat small{color:var(--text-3);font-size:12px}
.stat .k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);font-weight:500}
.stat .dot{width:8px;height:8px;border-radius:50%}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1040px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stuck .why{font-size:12px;font-weight:500}
.load{display:flex;flex-direction:column;gap:14px;padding:16px}
.load-row{display:grid;grid-template-columns:132px 1fr 56px;gap:12px;align-items:center;font-size:13px}
.load-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.load-row .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load-row .num{text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums}
.ccards{display:flex;flex-direction:column;gap:10px}
.ccard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ccard:hover{border-color:var(--line-strong)}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.ccard .facts b{color:var(--text);font-weight:600}

/* área do cliente */
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chead h1{font-size:24px}
.chead .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .c{font:500 11px var(--mono);color:var(--text-3)}
.ov{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1040px){.ov{grid-template-columns:minmax(0,1fr)}}
.side-col{display:flex;flex-direction:column;gap:20px}
.onb{padding:16px;display:flex;flex-direction:column;gap:12px}
.onb-item{display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.onb-item.done span{color:var(--text-3);text-decoration:line-through}
.kv{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0}

/* quadro */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.people-filter{display:flex;gap:4px}
.people-filter button{border:0;background:none;padding:2px;border-radius:50%}
.people-filter button.on .av{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:outline-color .1s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{outline-color:var(--taupe)}
.col.nope{outline-color:var(--st-late)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.col-h b{font-size:13px;font-weight:600}
.col-h .c{font:500 12px var(--mono);color:var(--text-3)}
.col-h .hint{margin-left:auto;font-size:11px;color:var(--text-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:var(--shadow-sm);text-align:left;width:100%}
.kcard:hover{border-color:var(--line-strong)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.kcard .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.kcard .m .av{margin-left:auto;width:22px;height:22px}
.addcard{border:0;background:none;color:var(--text-3);text-align:left;padding:6px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px}
.addcard:hover{background:var(--hover);color:var(--text)}
.addin{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;resize:none;min-height:60px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl th{text-align:left;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .grp td{background:var(--surface-2);font-weight:600;font-size:12px;cursor:default}
.tbl .grp:hover td{background:var(--surface-2)}

/* postagens */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px 16px}
.pcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#222831;position:relative;border:1px solid var(--line);width:100%;transition:transform .15s,box-shadow .15s}
.pcard:hover .thumb{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pill{position:absolute;top:8px;left:8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.noart{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#F4EBDD}
.noart b{font-size:17px;line-height:1.2;font-weight:600;text-wrap:balance}
.noart small{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#A8A195}
.pcard .pt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pcard .pd{font-size:12px;color:var(--text-3)}
.newcard{aspect-ratio:4/5;border:1.5px dashed var(--line-strong);border-radius:10px;display:grid;place-items:center;color:var(--text-3);background:none;width:100%}
.newcard:hover{color:var(--text);border-color:var(--text-3)}

/* roteiros */
.slist{display:flex;flex-direction:column;gap:10px}
.scard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scard:hover{border-color:var(--line-strong)}
.scard .t{font-weight:600;font-size:15px}
.scard .hook{grid-column:1/-1;color:var(--text-2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.scard .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* calendário */
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhead h2{font-size:17px;min-width:160px;text-transform:capitalize}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;color:var(--text-2)}
.lg-btn.off{opacity:.45}
.lg-btn i{width:8px;height:8px;border-radius:2px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.mgrid .wd{background:var(--surface);padding:8px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);text-align:center}
.cell{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.cell.out .dn{color:var(--text-3);opacity:.6}
.dn{font:500 12px var(--mono);color:var(--text-2);padding:2px 4px;align-self:flex-start;border-radius:6px}
.cell.today .dn{background:var(--primary);color:var(--on-primary)}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.25;padding:3px 5px;border-radius:5px;border:0;text-align:left;width:100%;min-width:0;background:var(--k-bg,var(--surface-2));color:var(--k-fg,var(--text))}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev img{width:14px;height:17px;object-fit:cover;border-radius:2px;flex:none}
.more{font-size:11px;color:var(--text-3);padding:0 5px}
.k-post{--k-bg:var(--st-prog-bg);--k-fg:var(--st-prog)}
.k-ok{--k-bg:var(--st-ok-bg);--k-fg:var(--st-ok)}
.k-cli{--k-bg:var(--st-cli-bg);--k-fg:var(--st-cli)}
.k-adj{--k-bg:var(--st-adj-bg);--k-fg:var(--st-adj)}
.k-meet{--k-bg:var(--surface-2);--k-fg:var(--text)}
.k-task{--k-bg:var(--st-neu-bg);--k-fg:var(--st-neu)}
.k-late{--k-bg:var(--st-late-bg);--k-fg:var(--st-late)}
.agenda{display:none;flex-direction:column;gap:14px}
.ag-day{display:flex;flex-direction:column;gap:6px}
.ag-day h3{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.ag-day h3.today{color:var(--text)}
.ag-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.ag-item img{width:32px;height:40px;object-fit:cover;border-radius:4px}
.ag-item .tt{font-weight:500;flex:1;min-width:0}
.ag-item .kk{width:4px;align-self:stretch;border-radius:2px;background:var(--k-fg)}
@media (max-width:760px){.cal-wrap .mgrid{display:none}.cal-wrap .agenda{display:flex}}

/* documentos */
.docs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.docs{grid-template-columns:minmax(0,1fr)}}
.doclist{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
@media (max-width:900px){.doclist{position:static;flex-direction:row;overflow-x:auto;gap:6px}}
.docbtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--text-2);font-weight:500;white-space:nowrap}
.docbtn:hover{background:var(--hover);color:var(--text)}
.docbtn.on{background:var(--surface-2);color:var(--text)}
.doc{max-width:720px;display:flex;flex-direction:column;gap:14px}
.doc .dmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.doc .vis{display:inline-flex;align-items:center;gap:6px}
.doc h1{font-size:28px;line-height:1.15}
.doc h2{font-size:18px;margin-top:10px}
.doc p,.doc li{font-size:15px;line-height:1.65;color:var(--text)}
.doc p{white-space:pre-wrap}
.doc ul,.doc ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.doc ol.steps{list-style:none;padding:0;counter-reset:s;gap:8px}
.doc ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline}
.doc ol.steps li::before{content:counter(s,decimal-leading-zero);font:500 12px var(--mono);color:var(--text-3)}
.doc .callout{display:flex;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.doc .callout p{font-size:14px}
.doc .checks{display:flex;flex-direction:column;gap:6px}
.doc .checks .ci{display:flex;gap:10px;align-items:flex-start}
.doc .checks .ci .chk{margin-top:3px}
.doc .checks .ci.done span{color:var(--text-3);text-decoration:line-through}
[contenteditable="true"]{outline:none;border-radius:4px;transition:background .1s}
[contenteditable="true"]:hover{background:var(--hover)}
[contenteditable="true"]:focus{background:var(--hover);box-shadow:0 0 0 2px var(--hover)}
[contenteditable="true"]:empty::before{content:attr(data-ph);color:var(--text-3)}
.addblock{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}

/* links */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.lcard .fav{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:600 13px var(--mono);color:var(--text-2);flex:none}
.lcard .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .url{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .body{flex:1;min-width:0}
.lcard a.btn{text-decoration:none}
.lform{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:end}
@media (max-width:760px){.lform{grid-template-columns:1fr}}

/* equipe */
.lvl-tbl td:not(:first-child),.lvl-tbl th:not(:first-child){text-align:center;width:120px}
.yes{color:var(--st-ok);font-weight:600}
.no{color:var(--text-3)}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{padding:16px;display:flex;flex-direction:column;gap:12px}
.person .top{display:flex;gap:12px;align-items:center}
.person .top b{display:block;font-size:15px}
.person .top small{color:var(--text-3)}
.person .facts{display:flex;gap:16px;font-size:12px;color:var(--text-3)}
.person .facts b{color:var(--text);font-size:15px;display:block;font-variant-numeric:tabular-nums}

/* inbox */
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 12px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.note:hover{background:var(--hover)}
.note .txt{flex:1;min-width:0}
.note .txt b{font-weight:600}
.note .when{font-size:12px;color:var(--text-3);white-space:nowrap}
.note .unread{width:8px;height:8px;border-radius:50%;background:var(--st-cli);margin-top:8px;flex:none}
.note.read .unread{visibility:hidden}
.note.read .txt{color:var(--text-2)}

/* gaveta, modal, paleta, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.drawer{width:min(760px,100%);height:100%;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .18s ease}
.drawer.narrow{width:min(620px,100%)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;flex:1}
.dbody{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:22px}
.dtitle{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;align-items:center;font-size:13px}
.props dt{color:var(--text-3)}
.props dd{margin:0;min-width:0}
.props .sel,.props .inp{height:32px;font-size:13px;max-width:280px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{height:4px;flex:1;min-width:18px;border-radius:2px;background:var(--surface-2)}
.stepper span.on{background:var(--taupe)}
.primary-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.primary-act .hint{font-size:13px;color:var(--text-2);flex:1;min-width:180px}
.pd-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.pd-grid{grid-template-columns:minmax(0,1fr)}.dbody{padding:16px 16px 40px}.props{grid-template-columns:100px minmax(0,1fr)}}
.caption{font-size:14px;line-height:1.6;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cta{font:400 12px/1.5 var(--mono);color:var(--text-3)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist .ci{display:flex;gap:10px;align-items:center;font-size:14px}
.checklist .ci.done span{color:var(--text-3);text-decoration:line-through}
.checklist .ci .chk{border-radius:5px}
.comments{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px}
.cmt .bub{flex:1;min-width:0}
.cmt .who{font-size:12px;color:var(--text-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmt .who b{color:var(--text);font-weight:600}
.cmt .txt{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.cmt.client .bub{background:var(--st-adj-bg);color:var(--st-adj);border-radius:10px;padding:8px 12px}
.cmt.client .who b,.cmt.client .txt{color:inherit}
.cmt.client .who{color:inherit;opacity:.9}
.mention{font-weight:600;color:var(--st-cli)}
.cform{display:flex;gap:8px;align-items:flex-end}
.cform .ta{min-height:40px;height:40px}
.script-blocks{display:flex;flex-direction:column;gap:14px}
.sblock{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.sblock .label{padding-top:4px}
.sblock p{font-size:15px;line-height:1.65;white-space:pre-wrap}
@media (max-width:600px){.sblock{grid-template-columns:minmax(0,1fr);gap:4px}}
.confirm-del{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}

.modal-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .15s ease}
.modal{width:min(540px,100%);max-height:calc(100% - 16px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);animation:pop .18s ease}
.mhd{padding:20px 22px 4px;display:flex;align-items:flex-start;gap:12px}
.mhd h2{font-size:18px;flex:1}
.mhd p{color:var(--text-3);margin-top:4px;font-size:13px}
.mbd{padding:16px 22px;display:flex;flex-direction:column;gap:14px}
.mft{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.msg{background:var(--st-ok-bg);color:var(--text);border-radius:12px 12px 12px 4px;padding:12px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg .lnk{font:500 12px var(--mono);background:var(--surface);border-radius:5px;padding:1px 6px;color:var(--st-cli)}
.wa{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}

.pal{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .12s ease}
.pal-box{width:min(640px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .15s ease}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:none;height:54px;font-size:16px;min-width:0}
.pal-in input:focus{outline:none}
.pal-res{max-height:min(420px,55vh);overflow-y:auto;padding:6px}
.pal-grp{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 4px}
.pal-it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.pal-it.on{background:var(--surface-2)}
.pal-it .sub{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.pal-it span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}

.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--toast-bg);color:var(--toast-fg);border-radius:10px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:14px;animation:pop .18s ease}
.toast button{border:0;background:none;color:var(--toast-act);font-weight:600;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.toast.warn{outline:2px solid var(--st-adj)}

/* ---------- prévia como cliente ---------- */
.pv{position:fixed;inset:0;z-index:55;background:#15191F;display:flex;flex-direction:column;animation:fade .15s ease}
.pv-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#F2F0EF;flex-wrap:wrap}
.pv-bar .ttl{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;min-width:200px}
.pv-bar .seg{background:#2A3039}
.pv-bar .seg button{color:#C9C2B6}
.pv-bar .seg button.on{background:#393E46;color:#F2F0EF}
.pv-bar .btn{background:#2A3039;border-color:#393E46;color:#F2F0EF}
.pv-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 20px;min-height:0;overflow:auto}
.device{background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.device.mobile{width:390px;max-width:100%;height:min(820px,calc(100vh - 120px));min-height:520px;border-radius:40px;border:10px solid #0B0D10;flex:none}
.device.desktop{width:min(1180px,100%);height:calc(100vh - 110px);min-height:480px;border-radius:12px;flex:none}

/* ---------- portal do cliente ---------- */
.portal{container:portal/inline-size;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.p-top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.p-top .logo{height:20px}
.p-top .cn{font-weight:600;color:var(--text-2);padding-left:12px;border-left:1px solid var(--line-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.p-top .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.p-top .seg button{height:26px;padding:0 9px;font:500 11px var(--mono);letter-spacing:.06em}
.p-menu{position:relative}
.p-menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:10;display:flex;flex-direction:column}
.p-menu .pop button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center}
.p-menu .pop button:hover{background:var(--hover)}
.p-tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.p-tab{border:0;background:none;padding:12px 12px 11px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative}
.p-tab:hover{color:var(--text)}
.p-tab.on{color:var(--text);border-bottom-color:var(--text)}
.p-tab .badge{font:600 11px/1 var(--mono);background:var(--st-cli);color:var(--surface);border-radius:9px;padding:3px 6px}
.p-scroll{flex:1;overflow-y:auto;min-height:0}
.p-body{max-width:780px;margin:0 auto;padding:36px 28px 72px;display:flex;flex-direction:column;gap:28px}
.hello h1{font-size:30px;line-height:1.15;letter-spacing:-.02em}
.hello p{color:var(--text-2);font-size:16px;margin-top:8px}
.aps{display:flex;flex-direction:column;gap:18px}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.ap-h{padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px}
.ap-h .k{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.ap-h h2{font-size:19px;line-height:1.25}

const PERM = { socio: new Set(['client.create', 'client.invite', 'people.invite', 'people.role', 'delete']), colab: new Set([]) };

/* ================= contexto ================= */
const Ctx = createContext();
const useApp = () => useContext(Ctx);

function personName(db, id) { if (id === 'client') return 'Cliente'; const p = db.people.find(x => x.id === id); return p ? p.name : '—'; }
function firstName(db, id) { return personName(db, id).split(' ')[0]; }
function itemOf(db, k, id) { return (k === 'task' ? db.tasks : k === 'post' ? db.posts : db.scripts).find(x => x.id === id); }

/* ================= peças pequenas ================= */
function Av({ id, lg }) {
  const { db } = useApp();
  if (id === 'client') return html`<span class=${cx('av', lg && 'lg')} title="Cliente"><${Icon} n="building" s=${12} /></span>`;
  const p = db.people.find(x => x.id === id);
  return html`<span class=${cx('av', lg && 'lg')} title=${p ? p.name : 'Sem responsável'}>${p ? p.ini : '—'}</span>`;
}
function CMark({ c, lg }) {
  if (c.id === 'mo') return html`<span class=${cx('cmark', lg && 'lg')} dangerouslySetInnerHTML=${{ __html: ICON }}></span>`;
  return html`<span class=${cx('cmark', lg && 'lg')}>${initials(c.name)}</span>`;
}
function CChip({ id }) {
  const { db } = useApp(); const c = db.clients.find(x => x.id === id); if (!c) return null;
  return html`<span class="cchip"><${CMark} c=${c} />${c.name}</span>`;
}
function Due({ date, done }) {
  if (!date) return html`<span class="due">sem prazo</span>`;
  const n = diff(date);
  if (!done && n < 0) return html`<span class="due late">atrasada ${plural(-n, 'dia')}</span>`;
  return html`<span class="due">${n === 0 ? 'hoje' : n === 1 ? 'amanhã' : fmt(date)}</span>`;
}
function Logo({ h }) { return html`<span class="logo" style=${h ? { height: h + 'px' } : null} dangerouslySetInnerHTML=${{ __html: LOGO }}></span>`; }
function PageHead({ title, sub, children }) {
  return html`<div class="phead"><div><h1>${title}</h1>${sub && html`<p class="sub">${sub}</p>`}</div>${children && html`<div class="acts">${children}</div>`}</div>`;
}
function Mentions({ text }) {
  return text.split(/(@[A-Za-zÀ-ú]+)/g).map((s, i) => s.startsWith('@') ? html`<span class="mention" key=${i}>${s}</span>` : s);
}

    addBlock: (pid, type) => commit(d => { d.pages.find(p => p.id === pid).blocks.push(type === 'check' ? { type, items: [{ t: '', done: false }] } : { type, text: '' }); }),
    addLink: (cid, l) => commit(d => d.clients.find(c => c.id === cid).links.push({ id: uid('l'), ...l }), 'Link adicionado'),
    delLink: (cid, lid) => commit(d => { const c = d.clients.find(c => c.id === cid); c.links = c.links.filter(l => l.id !== lid); }, 'Link removido'),
    readNote: id => commit(d => { d.notes.find(n => n.id === id).read = true; }),
    readAll: () => commit(d => d.notes.forEach(n => { if (n.to === me.id) n.read = true; }), 'Tudo marcado como lido'),
    invitePerson: f => commit(d => d.people.push({ id: uid('u'), name: f.name, ini: initials(f.name), role: f.role, func: f.func || '—', invited: true }), `Convite enviado para ${f.name}`, false),
    setRole: (id, role) => commit(d => { d.people.find(p => p.id === id).role = role; }, 'Nível de acesso alterado'),
  };

  useEffect(() => {
    const h = e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' && me) { e.preventDefault(); setPalette(p => !p); }
      if (e.key === 'Escape') { if (palette) setPalette(false); else if (modal) setModal(null); else if (drawer) setDrawer(null); else if (preview) setPreview(null); }
    };
    addEventListener('keydown', h); return () => removeEventListener('keydown', h);
  });

  const ctx = { db, act, me, can, session, setSession, route, go, open, drawer, setDrawer, modal, setModal, palette, setPalette, preview, setPreview, toast, theme, setTheme, sideOpen, setSideOpen, mainRef };

  let body;
  if (!session) body = html`<${Login} />`;
  else if (session.role === 'cliente') body = html`<${Portal} clientId=${session.clientId} />`;
  else body = html`<${TeamShell} />`;
  return html`<${Ctx.Provider} value=${ctx}>${body}
    ${preview && html`<${Preview} />`}
    ${drawer && html`<${DrawerHost} />`}
    ${modal && html`<${ModalHost} />`}
    ${palette && html`<${Palette} />`}
    <div class="toasts" role="status" aria-live="polite">${toasts.map(t => html`<div class=${cx('toast', t.tone)} key=${t.id}><span>${t.msg}</span>${t.snap && html`<button onClick=${() => undoTo(t)}>Desfazer</button>`}</div>`)}</div>
  <//>`;
}

/* ================= meu dia ================= */
function MyDay() {
  const { db, me, act } = useApp();
  const [q, setQ] = useState(''); const [cid, setCid] = useState(db.clients[0].id);
  const mine = db.tasks.filter(t => t.assignee === me.id && t.status !== 'done');
  const back = [...db.posts.map(x => ['post', x]), ...db.scripts.map(x => ['script', x])].filter(([, x]) => x.assignee === me.id && x.status === 'ajuste');
  const backT = mine.filter(t => t.changeReq);
  const late = mine.filter(t => t.due && diff(t.due) < 0 && !t.changeReq);
  const today = mine.filter(t => t.due && diff(t.due) === 0 && !t.changeReq);
  const week = mine.filter(t => t.due && diff(t.due) > 0 && diff(t.due) <= 7 && !t.changeReq);
  const later = mine.filter(t => (!t.due || diff(t.due) > 7) && !t.changeReq);
  const doneToday = db.tasks.filter(t => t.assignee === me.id && t.status === 'done' && diff(t.since) === 0);
  const h = new Date().getHours();
  const hi = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const dateStr = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }).format(T0);
  const add = e => { e.preventDefault(); if (!q.trim()) return; act.addTask({ title: q.trim(), assignee: me.id, clientId: cid }); setQ(''); };
  const Sec = (title, items) => items.length ? html`<section class="sec"><div class="sec-h"><h2>${title}</h2><span class="c">${items.length}</span></div><div class="list">${items.map(t => html`<${TaskRow} t=${t} key=${t.id} />`)}</div></section>` : null;
  return html`<div class="page">
    <${PageHead} title=${`${hi}, ${me.name.split(' ')[0]}`} sub=${`${dateStr[0].toUpperCase() + dateStr.slice(1)} · ${late.length + today.length ? plural(late.length + today.length, 'tarefa') + ' pra hoje' : 'nada vencendo hoje'}`} />
    <form class="quick" onSubmit=${add}>
      <${Icon} n="plus" />
      <label class="sr" for="quick-add">Nova tarefa</label>
      <input id="quick-add" placeholder="Adicionar tarefa pra você e apertar Enter" value=${q} onInput=${e => setQ(e.target.value)} />

      <select id="quick-client" class="sel" value=${cid} onChange=${e => setCid(e.target.value)}>${db.clients.map(c => html`<option value=${c.id}>${c.name}</option>`)}</select>
    </form>
    ${(back.length > 0 || backT.length > 0) && html`<section class="sec"><div class="sec-h"><h2>Voltou com ajuste do cliente</h2><span class="c">${back.length + backT.length}</span></div>
      <div class="callback">${back.map(([k, x]) => { const c = [...x.comments].reverse().find(c => c.by === 'client'); return html`<${ItemRow} k=${k} x=${x} key=${x.id} why=${'Ajuste pedido ' + rel(x.since)} tone="adj">${c && html`<div class="quote" style="flex-basis:100%">${c.slide ? `Slide ${c.slide}: ` : ''}"${c.text}"</div>`}<//>`; })}
      ${backT.map(t => html`<${TaskRow} t=${t} key=${t.id} />`)}</div></section>`}
    ${Sec("Atrasadas", late)}
    ${Sec("Hoje", today)}
    ${Sec("Próximos 7 dias", week)}
    ${Sec("Depois", later)}
    ${doneToday.length > 0 && html`${Sec("Feitas hoje", doneToday)}`}
    ${mine.length === 0 && back.length === 0 && html`<div class="card empty">Nada com você agora. Adicione uma tarefa acima.</div>`}
  </div>`;
}

/* ================= visão geral ================= */
function stuckOf(db) {
  const out = [];
  db.tasks.forEach(t => {
    if (t.status === 'done') return;
    const s = -diff(t.since);
    if (t.due && diff(t.due) < 0) out.push({ k: 'task', x: t, n: -diff(t.due), why: `Atrasada ${plural(-diff(t.due), 'dia')}`, tone: 'late' });
    else if (t.status === 'client' && s >= 3) out.push({ k: 'task', x: t, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (t.status === 'review' && s >= 5) out.push({ k: 'task', x: t, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  [...db.posts.map(x => ['post', x]), ...db.scripts.map(x => ['script', x])].forEach(([k, x]) => {
    const s = -diff(x.since);
    if (x.status === 'cliente' && s >= 3) out.push({ k, x, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (x.status === 'ajuste') out.push({ k, x, n: s + 1, why: `Ajuste pedido ${rel(x.since)}`, tone: 'adj' });
    else if (x.status === 'revisao' && s >= 5) out.push({ k, x, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  return out.sort((a, b) => b.n - a.n);
}
function Overview() {
  const { db, go, setModal } = useApp();
  const waitingItems = [...db.posts.filter(p => p.status === 'cliente'), ...db.scripts.filter(s => s.status === 'cliente'), ...db.tasks.filter(t => t.status === 'client')];
  const oldest = waitingItems.reduce((m, x) => Math.max(m, -diff(x.sentAt || x.since)), 0);
  const late = db.tasks.filter(t => t.status !== 'done' && t.due && diff(t.due) < 0);
  const adj = [...db.posts, ...db.scripts].filter(x => x.status === 'ajuste').length + db.tasks.filter(t => t.changeReq).length;
  const week = db.posts.filter(p => p.date && ['agendado', 'aprovado'].includes(p.status) && diff(p.date) >= 0 && diff(p.date) <= 7).length + db.tasks.filter(t => t.type === 'entrega' && t.status !== 'done' && t.due && diff(t.due) >= 0 && diff(t.due) <= 7).length;
  const stuck = stuckOf(db);
  const load = db.people.map(p => {
    const open = db.tasks.filter(t => t.assignee === p.id && t.status !== 'done');
    const content = [...db.posts, ...db.scripts].filter(x => x.assignee === p.id && ['producao', 'revisao', 'ajuste', 'rascunho'].includes(x.status)).length;
    return { p, total: open.length + content, late: open.filter(t => t.due && diff(t.due) < 0).length };
  });
  const max = Math.max(1, ...load.map(l => l.total));
  const Stat = (k, n, sub, color) => html`<div class="card stat"><span class="k"><i class="dot" style=${{ background: color }}></i>${k}</span><b>${n}</b><small>${sub}</small></div>`;
  return html`<div class="page">
    <${PageHead} title="Visão geral" sub="Toda a operação: o que travou, o que espera o cliente e quem está com o quê." />
    <div class="stats">
      ${Stat('Esperando o cliente', waitingItems.length, oldest ? `a mais antiga há ${plural(oldest, 'dia')}` : 'nada parado', 'var(--st-cli)')}
      ${Stat('Atrasadas', late.length, late.length ? 'prazo vencido e ainda aberta' : 'tudo no prazo', 'var(--st-late)')}
      ${Stat('Ajuste pedido', adj, 'voltou do cliente', 'var(--st-adj)')}
      ${Stat('Sai nos próximos 7 dias', week, 'posts aprovados e entregas', 'var(--st-ok)')}
    </div>
    <div class="grid2">
      <section class="sec stuck"><div class="sec-h"><h2>Onde travou</h2><span class="c">${stuck.length}</span></div>
        <div class="list">${stuck.length ? stuck.map(s => html`<${ItemRow} k=${s.k} x=${s.x} why=${s.why} tone=${s.tone} key=${s.x.id}>${s.remind && html`<button class="btn sm" onClick=${e => { e.stopPropagation(); setModal({ t: 'remind', clientId: s.x.clientId }); }}><${Icon} n="msg" s=${13} />Lembrar o cliente</button>`}<//>`) : html`<div class="empty">Nada travado. Bom sinal.</div>`}</div>
      </section>
      <div class="side-col">
        <section class="sec"><div class="sec-h"><h2>Carga por pessoa</h2></div>
          <div class="card load">${load.map(l => html`<div class="load-row" key=${l.p.id}><span class="who"><${Av} id=${l.p.id} /><span>${l.p.name.split(' ')[0]}</span></span>
            <span class="bar" title=${`${l.total} em aberto, ${l.late} atrasadas`}><i class="late" style=${{ width: (l.late / max * 100) + '%' }}></i><i style=${{ width: ((l.total - l.late) / max * 100) + '%' }}></i></span>
            <span class="num">${l.total}${l.late ? html` · <span style="color:var(--st-late)">${l.late}</span>` : ''}</span></div>`)}
            <p class="muted" style="font-size:12px">Tarefas abertas mais peças em produção. Em vermelho, as atrasadas.</p></div>
        </section>
        <section class="sec"><div class="sec-h"><h2>Clientes</h2><span class="c">${db.clients.length}</span></div>
          <div class="ccards">${db.clients.map(c => {
            const w = [...db.posts, ...db.scripts].filter(x => x.clientId === c.id && x.status === 'cliente').length + db.tasks.filter(t => t.clientId === c.id && t.status === 'client').length;
            const nx = db.posts.filter(p => p.clientId === c.id && p.date && diff(p.date) >= 0 && ['agendado', 'aprovado'].includes(p.status)).sort((a, b) => a.date.localeCompare(b.date))[0];
            const ob = c.onboarding.filter(o => o.done).length;
            return html`<button class="ccard" key=${c.id} onClick=${() => go({ v: 'client', id: c.id, tab: 'overview' })}>
              <span class="top"><${CMark} c=${c} /><b>${c.name}</b>${c.zero && html`<span class="tag">CLIENTE ZERO</span>`}</span>
              <span class="facts"><span><b>${w}</b> esperando o cliente</span><span>Próximo post: <b>${nx ? fmt(nx.date) : '—'}</b></span></span>
              <span style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3)"><span class="bar" style="flex:1"><i style=${{ width: (ob / c.onboarding.length * 100) + '%' }}></i></span>Onboarding ${ob}/${c.onboarding.length}</span>
            </button>`; })}</div>
        </section>
      </div>
    </div>
  </div>`;
}

/* ================= área do cliente (time) ================= */
function ClientArea({ id, tab }) {
  const { db, go, can, setModal, setPreview } = useApp();
  const c = db.clients.find(x => x.id === id);
  if (!c) return html`<div class="page"><div class="card empty">Cliente não encontrado.</div></div>`;
  const nTasks = db.tasks.filter(t => t.clientId === id && t.status !== 'done').length;
  const nPosts = db.posts.filter(p => p.clientId === id).length;
  const nScripts = db.scripts.filter(s => s.clientId === id).length;
  const tabs = [['overview', 'Visão geral'], ['tasks', 'Tarefas', nTasks], ['posts', 'Postagens', nPosts], ['scripts', 'Roteiros', nScripts], ['calendar', 'Calendário'], ['process', 'Processos'], ['links', 'Links', c.links.length]];
  const setTab = t => go({ v: 'client', id, tab: t });
  let view;
  switch (tab) {
    case 'tasks': view = html`<${TasksTab} c=${c} />`; break;
    case 'posts': view = html`<${PostsTab} c=${c} />`; break;
    case 'scripts': view = html`<${ScriptsTab} c=${c} />`; break;
    case 'calendar': view = html`<${TeamCalendar} c=${c} />`; break;
    case 'process': view = html`<${Docs} pages=${db.pages.filter(p => p.clientId === id)} editable clientPage />`; break;

function TasksTab({ c }) {

      const col = tasks.filter(t => t.status === st);

      return html`<div key=${st} class=${cx('col', over === st && !nope && 'over', nope && 'nope')} onDragOver=${e => { e.preventDefault(); setOver(st); }} onDragLeave=${() => setOver(o => o === st ? null : o)} onDrop=${() => drop(st)}>
        <div class="col-h"><b>${label}</b><span class="c">${col.length}</span>${st === 'client' && html`<span class="hint">só entregas</span>`}</div>
        ${col.map(t => html`<div key=${t.id} class=${cx('kcard', drag === t.id && 'dragging')} draggable="true" onDragStart=${e => { setDrag(t.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', t.id); } catch (_) {} }} onDragEnd=${() => { setDrag(null); setOver(null); }} onClick=${() => open('task', t.id)} role="button" tabindex="0" onKeyDown=${e => e.key === 'Enter' && open('task', t.id)}>
          <span class="t">${t.title}</span>
          <span class="m">${t.type === 'entrega' && html`<span class="tag">ENTREGA</span>`}${t.changeReq && html`<span class="pill t-adj">Ajuste</span>`}${t.priority === 'alta' && html`<span class="tag">ALTA</span>`}<${Due} date=${t.due} done=${t.status === 'done'} />${t.checklist.length > 0 && html`<span>${t.checklist.filter(x => x.done).length}/${t.checklist.length}</span>`}<${Av} id=${t.assignee} /></span>
        </div>`)}
        ${adding === st ? html`<textarea class="addin" ref=${autoF} placeholder="Título da tarefa" value=${txt} onInput=${e => setTxt(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); addIn(st); } if (e.key === 'Escape') { e.stopPropagation(); setAdding(null); } }} onBlur=${() => addIn(st)}></textarea>`
          : st !== 'client' && html`<button class="addcard" onClick=${() => { setAdding(st); setTxt(''); }}><${Icon} n="plus" s=${14} />Adicionar</button>`}

      ${TASK_ST.map(([st, label]) => { const col = tasks.filter(t => t.status === st); if (!col.length) return null; return [html`<tr class="grp" key=${'g' + st}><td colspan="4">${label} · ${col.length}</td></tr>`, ...col.map(t => html`<tr key=${t.id} onClick=${() => open('task', t.id)}><td><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${t.title}${t.type === 'entrega' && html`<span class="tag">ENTREGA</span>`}</span></td><td><span style="display:flex;gap:8px;align-items:center;white-space:nowrap"><${Av} id=${t.assignee} />${firstName(db, t.assignee)}</span></td><td><${Due} date=${t.due} done=${t.status === 'done'} /></td><td>${PRIO[t.priority]}</td></tr>`)]; })}
    </tbody></table></div>`}

function calItems(db, cid, forClient) {
  const it = [];
  db.posts.filter(p => p.clientId === cid && p.date && (!forClient || POST_VISIBLE.includes(p.status))).forEach(p => it.push({ id: p.id, date: p.date, title: p.title, kind: 'post', k: 'post', cls: p.status === 'cliente' ? 'k-cli' : p.status === 'ajuste' ? 'k-adj' : ['aprovado', 'agendado', 'publicado'].includes(p.status) ? 'k-ok' : 'k-post', img: p.imgs[0], st: p.status }));
  db.scripts.filter(s => s.clientId === cid && s.record && (!forClient || SCRIPT_VISIBLE.includes(s.status))).forEach(s => it.push({ id: s.id, date: s.record, title: 'Gravação: ' + s.title, kind: 'script', k: 'script', cls: 'k-post', st: s.status }));
  db.tasks.filter(t => t.clientId === cid && t.due && (!forClient ? true : t.type === 'entrega')).forEach(t => it.push({ id: t.id, date: t.due, title: t.title, kind: t.type === 'entrega' ? 'entrega' : 'task', k: 'task', cls: t.status !== 'done' && diff(t.due) < 0 ? 'k-late' : t.type === 'entrega' ? 'k-cli' : 'k-task', st: t.status }));
  db.events.filter(e => e.clientId === cid).forEach(e => it.push({ id: e.id, date: e.date, title: `${e.time} ${e.title}`, kind: 'meet', cls: 'k-meet' }));
  return it;
}
function MonthGrid({ items, onOpen, lang = 'pt', month, setMonth, legend }) {

  const wds = Array.from({ length: 7 }, (_, i) => new Intl.DateTimeFormat(LOC(lang), { weekday: 'short' }).format(new Date(2026, 0, 4 + i)).replace('.', ''));
  const byDay = {}; items.forEach(i => (byDay[i.date] = byDay[i.date] || []).push(i));
  const monthName = new Intl.DateTimeFormat(LOC(lang), { month: 'long', year: 'numeric' }).format(first);
  const agenda = Object.keys(byDay).filter(k => diff(k) >= -1 && diff(k) <= 45).sort();
  const t = TX[lang];
  const Ev = i => html`<button class=${'ev ' + i.cls} onClick=${() => onOpen(i)} title=${i.title}>${i.img && html`<img src=${i.img} alt="" />`}<span>${i.title}</span></button>`;
  return html`<div class="cal-wrap">
    <div class="mhead"><h2>${monthName}</h2>

      <span style="flex:1"></span>${legend}</div>
    <div class="mgrid">${wds.map(w => html`<div class="wd" key=${w}>${w}</div>`)}
      ${days.map(x => { const k = iso(x); const its = byDay[k] || []; return html`<div key=${k} class=${cx('cell', x.getMonth() !== month.getMonth() && 'out', k === iso(T0) && 'today')}><span class="dn">${x.getDate()}</span>${its.slice(0, 3).map(Ev)}${its.length > 3 && html`<span class="more">+${its.length - 3}</span>`}</div>`; })}
    </div>

      ${byDay[k].map(i => html`<button key=${i.id} class=${'ag-item ' + i.cls} onClick=${() => onOpen(i)}><span class="kk"></span>${i.img && html`<img src=${i.img} alt="" />`}<span class="tt">${i.title}</span></button>`)}</div>`) : html`<div class="card empty">${t.nothingCal}</div>`}</div>
  </div>`;

const KINDS = [['post', 'Posts', 'k-ok'], ['entrega', 'Entregas', 'k-cli'], ['task', 'Tarefas internas', 'k-task'], ['script', 'Gravações', 'k-post'], ['meet', 'Reuniões', 'k-meet']];

function Editable({ tag = 'p', text, onSave, editable, ph, single }) {

}

    ${page.blocks.map((b, i) => {

      if (b.type === 'callout') return html`<div class="callout" key=${i}><${Icon} n="alert" s=${16} /><${Editable} text=${b.text} editable=${editable} onSave=${v => save(i, { text: v })} /></div>`;
      if (b.type === 'steps' || b.type === 'ul') { const L = b.type === 'steps' ? 'ol' : 'ul'; return html`<${L} key=${i} class=${b.type === 'steps' ? 'steps' : ''}>${b.items.map((it, j) => html`<${Editable} key=${j} tag="li" text=${it} editable=${editable} single onSave=${v => listSave(i, j, v)} />`)}<//>`; }
      if (b.type === 'check') return html`<div class="checks" key=${i}>${b.items.map((it, j) => html`<div key=${j} class=${cx('ci', it.done && 'done')}><button class=${cx('chk sq', it.done && 'on')} disabled=${!editable} aria-label="Marcar" onClick=${() => { const items = b.items.map((x, k) => k === j ? { ...x, done: !x.done } : x); save(i, { items }); }}>${it.done && html`<${Icon} n="check" s=${12} />`}</button><${Editable} tag="span" text=${it.t} editable=${editable} single ph="Item" onSave=${v => { const items = b.items.map((x, k) => k === j ? { ...x, t: v } : x); save(i, { items }); }} /></div>`)}

function Slider({ imgs, title }) {
  const [i, setI] = useState(0); const x0 = useRef(null);
  if (!imgs.length) return html`<div class="slider"><div class="noart"><small>Sem arte ainda</small><b>${title}</b><small>A arte aparece aqui quando o design subir</small></div></div>`;
  const go = n => setI(Math.max(0, Math.min(imgs.length - 1, n)));
  return html`<div class="slider" onPointerDown=${e => { x0.current = e.clientX; }} onPointerUp=${e => { if (x0.current == null) return; const dx = e.clientX - x0.current; x0.current = null; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); }}>
      <img src=${imgs[i]} alt=${`${title}, slide ${i + 1} de ${imgs.length}`} draggable="false" />
      ${imgs.length > 1 && html`<span class="sl-count">${i + 1}/${imgs.length}</span>`}
      ${i > 0 && html`<button class="sl-nav l" aria-label="Slide anterior" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i - 1)}><${Icon} n="chevL" /></button>`}
      ${i < imgs.length - 1 && html`<button class="sl-nav r" aria-label="Próximo slide" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i + 1)}><${Icon} n="chevR" /></button>`}
    </div>
    ${imgs.length > 1 && html`<div class="dots">${imgs.map((_, k) => html`<button key=${k} class=${cx(k === i && 'on')} aria-label=${`Slide ${k + 1}`} onClick=${() => setI(k)}></button>`)}</div>`}`;
}

/* ================= paleta ⌘K ================= */
function Palette() {
  const { db, go, open, setPalette, setModal, can, setPreview, theme, setTheme } = useApp();
  const [q, setQ] = useState(''); const [sel, setSel] = useState(0);
  const all = useMemo(() => {
    const L = [];
    L.push(['Ações', 'plus', 'Ir para Meu dia', '', () => go({ v: 'myday' })], ['Ações', 'grid', 'Ir para Visão geral', '', () => go({ v: 'overview' })], ['Ações', 'inbox', 'Abrir caixa de entrada', '', () => go({ v: 'inbox' })]);
    if (can('client.create')) L.push(['Ações', 'plus', 'Novo cliente', '', () => setModal({ t: 'newClient' })]);
    L.push(['Ações', theme === 'dark' ? 'sun' : 'moon', theme === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro', '', () => setTheme(theme === 'dark' ? 'light' : 'dark')]);
    db.clients.forEach(c => { L.push(['Clientes', 'building', c.name, 'abrir área', () => go({ v: 'client', id: c.id, tab: 'overview' })]); L.push(['Clientes', 'eye', `Ver como ${c.name} vê`, 'prévia', () => setPreview({ clientId: c.id, device: 'mobile' })]); });
    db.tasks.forEach(t => L.push(['Tarefas', 'tasks', t.title, stOf('task', t.status)[1], () => open('task', t.id)]));
    db.posts.forEach(p => L.push(['Postagens', 'image', p.title, stOf('post', p.status)[1], () => open('post', p.id)]));
    db.scripts.forEach(s => L.push(['Roteiros', 'script', s.title, stOf('script', s.status)[1], () => open('script', s.id)]));
    db.pages.forEach(p => L.push(['Páginas', 'file', p.title, p.clientId ? 'processo do cliente' : 'processo interno', () => p.clientId ? go({ v: 'client', id: p.clientId, tab: 'process' }) : go({ v: 'wiki' })]));
    return L;
  }, [db]);
  const res = (q ? all.filter(x => norm(x[2] + ' ' + x[3] + ' ' + x[0]).includes(norm(q))) : all.filter(x => x[0] === 'Ações' || x[0] === 'Clientes')).slice(0, 40);
  const run = x => { setPalette(false); x[4](); };
  let lastG = null;
  return html`<div class="pal" onClick=${e => e.target === e.currentTarget && setPalette(false)}><div class="pal-box" role="dialog" aria-modal="true" aria-label="Buscar">
    <div class="pal-in"><${Icon} n="search" s=${18} /><input ref=${autoF} placeholder="Buscar tarefa, post, roteiro, cliente ou ação" value=${q} onInput=${e => { setQ(e.target.value); setSel(0); }}
      onKeyDown=${e => { if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(res.length - 1, s + 1)); } if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(0, s - 1)); } if (e.key === 'Enter' && res[sel]) run(res[sel]); }} /><kbd>esc</kbd></div>
    <div class="pal-res">${res.length ? res.map((x, i) => { const g = x[0] !== lastG ? html`<div class="pal-grp">${x[0]}</div>` : null; lastG = x[0]; return html`${g}<button key=${i} class=${cx('pal-it', i === sel && 'on')} onMouseEnter=${() => setSel(i)} onClick=${() => run(x)}><${Icon} n=${x[1]} /><span class="t">${x[2]}</span><span class="sub">${x[3]}</span></button>`; }) : html`<div class="empty">Nada encontrado para "${q}".</div>`}</div>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>enter</kbd> abrir</span><span><kbd>⌘K</kbd> abre de qualquer tela</span></div>
  </div></div>`;
}

function PortalHome({ c, lang, goCal }) {

  const list = c.links.filter(l => l.shared);
  return html`<div class="sec" style="gap:16px"><h1 style="font-size:24px">${t.sharedLinks}</h1>
    ${list.length ? html`<div class="lgrid">${list.map(l => html`<${LinkCard} key=${l.id} l=${l} lang=${lang} copied=${copied === l.id} onCopy=${() => copyText(l.url, ok => { setCopied(ok ? l.id : null); setTimeout(() => setCopied(null), 1600); })} />`)}</div>` : html`<div class="card empty">${t.noLinks}</div>`}</div>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
