/* ================= visão geral ================= */
function stuckOf(db) {
  const out = [];
  db.tasks.forEach(t => {
    if (t.status === 'done') return;
    const s = -diff(t.since);
    if (t.due && diff(t.due) < 0) out.push({ k: 'task', x: t, n: -diff(t.due), why: `Atrasada ${plural(-diff(t.due), 'dia')}`, tone: 'late' });
    else if (t.status === 'client' && s >= 3) out.push({ k: 'task', x: t, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (t.status === 'review' && s >= 5) out.push({ k: 'task', x: t, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  [...db.posts.map(x => ['post', x]), ...db.scripts.map(x => ['script', x])].forEach(([k, x]) => {
    const s = -diff(x.since);
    if (x.status === 'cliente' && s >= 3) out.push({ k, x, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (x.status === 'ajuste') out.push({ k, x, n: s + 1, why: `Ajuste pedido ${rel(x.since)}`, tone: 'adj' });
    else if (x.status === 'revisao' && s >= 5) out.push({ k, x, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  return out.sort((a, b) => b.n - a.n);
}
function Overview() {
  const { db, go, setModal } = useApp();
  const waitingItems = [...db.posts.filter(p => p.status === 'cliente'), ...db.scripts.filter(s => s.status === 'cliente'), ...db.tasks.filter(t => t.status === 'client')];
  const oldest = waitingItems.reduce((m, x) => Math.max(m, -diff(x.sentAt || x.since)), 0);
  const late = db.tasks.filter(t => t.status !== 'done' && t.due && diff(t.due) < 0);
  const adj = [...db.posts, ...db.scripts].filter(x => x.status === 'ajuste').length + db.tasks.filter(t => t.changeReq).length;
  const week = db.posts.filter(p => p.date && ['agendado', 'aprovado'].includes(p.status) && diff(p.date) >= 0 && diff(p.date) <= 7).length + db.tasks.filter(t => t.type === 'entrega' && t.status !== 'done' && t.due && diff(t.due) >= 0 && diff(t.due) <= 7).length;
  const stuck = stuckOf(db);
  const load = db.people.map(p => {
    const open = db.tasks.filter(t => t.assignee === p.id && t.status !== 'done');
    const content = [...db.posts, ...db.scripts].filter(x => x.assignee === p.id && ['producao', 'revisao', 'ajuste', 'rascunho'].includes(x.status)).length;
    return { p, total: open.length + content, late: open.filter(t => t.due && diff(t.due) < 0).length };
  });
  const max = Math.max(1, ...load.map(l => l.total));
  const Stat = (k, n, sub, color) => html`<div class="card stat"><span class="k"><i class="dot" style=${{ background: color }}></i>${k}</span><b>${n}</b><small>${sub}</small></div>`;
  return html`<div class="page">
    <${PageHead} title="Visão geral" sub="Toda a operação: o que travou, o que espera o cliente e quem está com o quê." />
    <div class="stats">
      ${Stat('Esperando o cliente', waitingItems.length, oldest ? `a mais antiga há ${plural(oldest, 'dia')}` : 'nada parado', 'var(--st-cli)')}
      ${Stat('Atrasadas', late.length, late.length ? 'prazo vencido e ainda aberta' : 'tudo no prazo', 'var(--st-late)')}
      ${Stat('Ajuste pedido', adj, 'voltou do cliente', 'var(--st-adj)')}
      ${Stat('Sai nos próximos 7 dias', week, 'posts aprovados e entregas', 'var(--st-ok)')}
    </div>
    <div class="grid2">
      <section class="sec stuck"><div class="sec-h"><h2>Onde travou</h2><span class="c">${stuck.length}</span></div>
        <div class="list">${stuck.length ? stuck.map(s => html`<${ItemRow} k=${s.k} x=${s.x} why=${s.why} tone=${s.tone} key=${s.x.id}>${s.remind && html`<button class="btn sm" onClick=${e => { e.stopPropagation(); setModal({ t: 'remind', clientId: s.x.clientId }); }}><${Icon} n="msg" s=${13} />Lembrar o cliente</button>`}<//>`) : html`<div class="empty">Nada travado. Bom sinal.</div>`}</div>
      </section>
      <div class="side-col">
        <section class="sec"><div class="sec-h"><h2>Carga por pessoa</h2></div>
          <div class="card load">${load.map(l => html`<div class="load-row" key=${l.p.id}><span class="who"><${Av} id=${l.p.id} /><span>${l.p.name.split(' ')[0]}</span></span>
            <span class="bar" title=${`${l.total} em aberto, ${l.late} atrasadas`}><i class="late" style=${{ width: (l.late / max * 100) + '%' }}></i><i style=${{ width: ((l.total - l.late) / max * 100) + '%' }}></i></span>
            <span class="num">${l.total}${l.late ? html` · <span style="color:var(--st-late)">${l.late}</span>` : ''}</span></div>`)}
            <p class="muted" style="font-size:12px">Tarefas abertas mais peças em produção. Em vermelho, as atrasadas.</p></div>
        </section>
        <section class="sec"><div class="sec-h"><h2>Clientes</h2><span class="c">${db.clients.length}</span></div>
          <div class="ccards">${db.clients.map(c => {
            const w = [...db.posts, ...db.scripts].filter(x => x.clientId === c.id && x.status === 'cliente').length + db.tasks.filter(t => t.clientId === c.id && t.status === 'client').length;
            const nx = db.posts.filter(p => p.clientId === c.id && p.date && diff(p.date) >= 0 && ['agendado', 'aprovado'].includes(p.status)).sort((a, b) => a.date.localeCompare(b.date))[0];
            const ob = c.onboarding.filter(o => o.done).length;
            return html`<button class="ccard" key=${c.id} onClick=${() => go({ v: 'client', id: c.id, tab: 'overview' })}>
              <span class="top"><${CMark} c=${c} /><b>${c.name}</b>${c.zero && html`<span class="tag">CLIENTE ZERO</span>`}</span>
              <span class="facts"><span><b>${w}</b> esperando o cliente</span><span>Próximo post: <b>${nx ? fmt(nx.date) : '—'}</b></span></span>

function calItems(db, cid, forClient) {
  const it = [];
  db.posts.filter(p => p.clientId === cid && p.date && (!forClient || POST_VISIBLE.includes(p.status))).forEach(p => it.push({ id: p.id, date: p.date, title: p.title, kind: 'post', k: 'post', cls: p.status === 'cliente' ? 'k-cli' : p.status === 'ajuste' ? 'k-adj' : ['aprovado', 'agendado', 'publicado'].includes(p.status) ? 'k-ok' : 'k-post', img: p.imgs[0], st: p.status }));
  db.scripts.filter(s => s.clientId === cid && s.record && (!forClient || SCRIPT_VISIBLE.includes(s.status))).forEach(s => it.push({ id: s.id, date: s.record, title: 'Gravação: ' + s.title, kind: 'script', k: 'script', cls: 'k-post', st: s.status }));
  db.tasks.filter(t => t.clientId === cid && t.due && (!forClient ? true : t.type === 'entrega')).forEach(t => it.push({ id: t.id, date: t.due, title: t.title, kind: t.type === 'entrega' ? 'entrega' : 'task', k: 'task', cls: t.status !== 'done' && diff(t.due) < 0 ? 'k-late' : t.type === 'entrega' ? 'k-cli' : 'k-task', st: t.status }));
  db.events.filter(e => e.clientId === cid).forEach(e => it.push({ id: e.id, date: e.date, title: `${e.time} ${e.title}`, kind: 'meet', cls: 'k-meet' }));
  return it;
}
function MonthGrid({ items, onOpen, lang = 'pt', month, setMonth, legend }) {

  const monthName = new Intl.DateTimeFormat(LOC(lang), { month: 'long', year: 'numeric' }).format(first);

  const Ev = i => html`<button class=${'ev ' + i.cls} onClick=${() => onOpen(i)} title=${i.title}>${i.img && html`<img src=${i.img} alt="" />`}<span>${i.title}</span></button>`;

      ${days.map(x => { const k = iso(x); const its = byDay[k] || []; return html`<div key=${k} class=${cx('cell', x.getMonth() !== month.getMonth() && 'out', k === iso(T0) && 'today')}><span class="dn">${x.getDate()}</span>${its.slice(0, 3).map(Ev)}${its.length > 3 && html`<span class="more">+${its.length - 3}</span>`}</div>`; })}

function Slider({ imgs, title }) {
  const [i, setI] = useState(0); const x0 = useRef(null);
  if (!imgs.length) return html`<div class="slider"><div class="noart"><small>Sem arte ainda</small><b>${title}</b><small>A arte aparece aqui quando o design subir</small></div></div>`;
  const go = n => setI(Math.max(0, Math.min(imgs.length - 1, n)));
  return html`<div class="slider" onPointerDown=${e => { x0.current = e.clientX; }} onPointerUp=${e => { if (x0.current == null) return; const dx = e.clientX - x0.current; x0.current = null; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); }}>
      <img src=${imgs[i]} alt=${`${title}, slide ${i + 1} de ${imgs.length}`} draggable="false" />
      ${imgs.length > 1 && html`<span class="sl-count">${i + 1}/${imgs.length}</span>`}
      ${i > 0 && html`<button class="sl-nav l" aria-label="Slide anterior" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i - 1)}><${Icon} n="chevL" /></button>`}
      ${i < imgs.length - 1 && html`<button class="sl-nav r" aria-label="Próximo slide" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i + 1)}><${Icon} n="chevR" /></button>`}
    </div>
    ${imgs.length > 1 && html`<div class="dots">${imgs.map((_, k) => html`<button key=${k} class=${cx(k === i && 'on')} aria-label=${`Slide ${k + 1}`} onClick=${() => setI(k)}></button>`)}</div>`}`;

const KIND_TONE = { traffic: 'prog', page: 'cli', buy: 'ok', talk: 'adj', lead: 'neu', meeting: 'ok' };
function computeFunnel(nodes, edges) {
  const by = Object.fromEntries(nodes.map(n => [n.id, n]));
  const inE = {}, outE = {}; nodes.forEach(n => { inE[n.id] = []; outE[n.id] = []; });
  edges.forEach(e => { if (by[e.from] && by[e.to] && e.from !== e.to) { outE[e.from].push(e); inE[e.to].push(e); } });
  const deg = Object.fromEntries(nodes.map(n => [n.id, inE[n.id].length]));
  const q = nodes.filter(n => !deg[n.id]).map(n => n.id); const order = [];
  while (q.length) { const id = q.shift(); order.push(id); outE[id].forEach(e => { if (--deg[e.to] === 0) q.push(e.to); }); }
  const vol = {}, flow = {}, buyers = {}, rev = {};
  let invest = 0, varCost = 0, visits = 0, leads = 0, qual = 0, meetings = 0, sales = 0, revenue = 0;
  order.forEach(id => {
    const n = by[id]; const T = FN[n.type] || {}; let v = 0;
    if (T.kind === 'traffic') { const own = T.paid ? num(n.p.invest) / Math.max(num(n.p.cpc), 0.01) : num(n.p.visits); v += own; visits += own; if (T.paid) invest += num(n.p.invest); }
    inE[id].forEach(e => { v += flow[e.id] || 0; });
    vol[id] = v;
    if (T.kind === 'talk') varCost += v * num(n.p.cost);
    if (T.kind === 'buy') { const c = n.p.conv === '' || n.p.conv == null ? 100 : num(n.p.conv); buyers[id] = v * c / 100; rev[id] = buyers[id] * num(n.p.price); sales += buyers[id]; revenue += rev[id]; }
    if (n.type === 'lead') leads += v; if (n.type === 'qualificado') qual += v; if (n.type === 'reuniao') meetings += v;
    outE[id].forEach(e => { flow[e.id] = v * num(e.rate) / 100; });
  });
  return { vol, flow, buyers, rev, cycle: order.length !== nodes.length,
    t: { invest, varCost, cost: invest + varCost, visits, leads, qual, meetings, sales, revenue, cpMeet: meetings ? (invest + varCost) / meetings : null, cpl: leads ? (invest + varCost) / leads : null, roas: invest && revenue ? revenue / (invest + varCost) : null } };
}

/* ================= v3: IA no quadro e no funil (só no acesso do Pedro) ================= */
function boardPrompt(q, hasImg) {
  return `Você desenha num quadro branco de uma agência. Transforme o pedido${hasImg ? ' e a imagem anexada (foto de quadro, papel ou esboço)' : ''} em elementos do quadro.
Responda SOMENTE com um JSON neste formato:
{"elementos":[{"tipo":"postit","texto":"curto","cor":"sand","coluna":0,"linha":1}],"setas":[{"de":0,"para":1}]}
- tipo: postit, texto, retangulo ou elipse. Use "texto" para títulos de coluna, sempre na linha 0.
- cor (só para postit): sand, cream, green, blue, lilac ou pink. Use a mesma cor para coisas do mesmo grupo.
- coluna e linha organizam o desenho: colunas são etapas da esquerda para a direita, linhas empilham itens da mesma etapa.
- setas ligam posições do array "elementos".
- Textos curtos (até 12 palavras), no idioma do pedido. No máximo 24 elementos. ${hasImg ? 'Reproduza a estrutura da imagem com fidelidade, sem inventar o que não está nela.' : 'Não invente dado, número ou nome que não esteja no pedido.'}
Pedido: ${q || '(sem texto; use só a imagem)'}`;
}
function funnelPrompt(q, hasImg) {
  return `Você monta funis de venda num construtor visual.${hasImg ? ' Use também a imagem anexada (foto de um funil desenhado ou de uma tela).' : ''}
Tipos de etapa disponíveis (use só estes códigos): ${Object.entries(FN).map(([k, t]) => `${k} = ${t.label}`).join('; ')}.
Responda SOMENTE com um JSON neste formato:
{"etapas":[{"tipo":"meta","nome":"Meta Ads","investimento":3000,"cpc":2.5,"visitas":0,"taxa_compra":0,"preco":0}],"ligacoes":[{"de":0,"para":1,"taxa":100}]}
- ligações apontam posições do array "etapas". taxa = porcentagem que passa de uma etapa para a outra.
- investimento e cpc só em tráfego pago; visitas só em tráfego orgânico; taxa_compra e preco só em checkout, upsell, downsell e venda.
- Use os números que o pedido ou a imagem trouxerem. Onde faltar taxa, use uma premissa conservadora típica de mercado; onde faltar investimento, preço ou visitas, deixe 0.
- Nomes curtos, no idioma do pedido.
Pedido: ${q || '(sem texto; use só a imagem)'}`;
}
function layoutFunnel(steps, links) {
  const n = steps.length; const indeg = Array(n).fill(0); links.forEach(l => { indeg[l.to]++; });
  const depth = Array(n).fill(0); const q = []; indeg.forEach((d, i) => { if (!d) q.push(i); }); const deg = [...indeg];
  while (q.length) { const i = q.shift(); links.filter(l => l.from === i).forEach(l => { depth[l.to] = Math.max(depth[l.to], depth[i] + 1); if (--deg[l.to] === 0) q.push(l.to); }); }
  const rows = {}; return steps.map((s, i) => { const d = depth[i]; const r = rows[d] = (rows[d] || 0) + 1; return { x: d * 250, y: (r - 1) * 150 }; });
}
function AiPanel({ kind, onResult, close }) {
  const [q, setQ] = useState(''); const [img, setImg] = useState(null); const [prev, setPrev] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [canImg, setCanImg] = useState(true); const [mode, setMode] = useState('add');
  useEffect(() => { (async () => { const s = await cap('sample'); if (!s) return; const l = await s.limits().catch(() => null); setCanImg(!!(l && l.images)); })(); }, []);
  const run = async () => {
    const s = await cap('sample'); if (!s) { setErr('O Claude não está disponível nesta visualização. Abra o link dentro do claude.ai.'); return; }
    setBusy(true); setErr('');
    try { const r = await s.json(kind === 'board' ? boardPrompt(q.trim(), !!img) : funnelPrompt(q.trim(), !!img), { modelTier: 'default', ...(img ? { images: img } : {}) }); onResult(r, mode); close(); }
    catch (e) { setErr(sampleMsg(e)); } finally { setBusy(false); }
  };
  return html`<div class="ai-pop" role="dialog" aria-label=${kind === 'board' ? 'Desenhar com IA' : 'Montar o funil com IA'} onPointerDown=${e => e.stopPropagation()}>
    <div class="pop-h"><b><${Icon} n="sparkle" s=${15} /> ${kind === 'board' ? 'Desenhar com IA' : 'Montar o funil com IA'}</b><button class="btn icon sm ghost" aria-label="Fechar" onClick=${close}><${Icon} n="x" s=${14} /></button></div>
    <label class="sr" for="ai-q">Pedido</label>
    <textarea id="ai-q" class="ta" ref=${autoF} placeholder=${kind === 'board' ? 'Ex.: desenha o onboarding do cliente novo em 3 etapas: dia 1, semana 1, semana 2' : 'Ex.: Meta Ads com 3 mil dólares, leva pro quiz, o agente qualifica no WhatsApp e agenda a reunião'} value=${q} onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(); }}></textarea>
    <p class="ai-hint"><${Icon} n="msg" s=${13} />Pra falar em vez de digitar, use o ditado do teclado: o microfone do teclado no celular, ou a tecla Fn duas vezes no Mac.</p>
    ${canImg && html`<div class="ai-att">${prev ? html`<span class="ai-thumb"><img src=${prev} alt="Imagem anexada" /><button class="btn icon sm ghost" aria-label="Tirar imagem" onClick=${() => { setImg(null); setPrev(null); }}><${Icon} n="x" s=${12} /></button></span>` : null}
      <label class="btn sm"><${Icon} n="image" s=${14} />${prev ? 'Trocar foto' : 'Anexar foto'}<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="sr" onChange=${e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) { setImg(f); setPrev(URL.createObjectURL(f)); } }} /></label>
      <span class="muted" style="font-size:12px">Foto de lousa, papel ou print</span></div>`}
    ${kind === 'funnel' && html`<div class="seg" style="align-self:flex-start"><button class=${cx(mode === 'add' && 'on')} onClick=${() => setMode('add')}>Adicionar ao lado</button><button class=${cx(mode === 'replace' && 'on')} onClick=${() => setMode('replace')}>Substituir o funil</button></div>`}
    ${err && html`<p class="err">${err}</p>`}
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onClick=${close}>Cancelar</button><button class="btn pri" disabled=${busy || (!q.trim() && !img)} onClick=${run}><${Icon} n="sparkle" s=${14} />${busy ? (kind === 'board' ? 'Desenhando…' : 'Montando…') : kind === 'board' ? 'Desenhar' : 'Montar'}</button></div>
  </div>`;
}
