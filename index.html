    </div>
    <div class="grid2">
      <section class="sec stuck"><div class="sec-h"><h2>Onde travou</h2><span class="c">${stuck.length}</span></div>
        <div class="list">${stuck.length ? stuck.map(s => html`<${ItemRow} k=${s.k} x=${s.x} why=${s.why} tone=${s.tone} key=${s.x.id}>${s.remind && html`<button class="btn sm" onClick=${e => { e.stopPropagation(); setModal({ t: 'remind', clientId: s.x.clientId }); }}><${Icon} n="msg" s=${13} />Lembrar o cliente</button>`}<//>`) : html`<div class="empty">Nada travado. Bom sinal.</div>`}</div>
      </section>
      <div class="side-col">
        <section class="sec"><div class="sec-h"><h2>Carga por pessoa</h2></div>
          <div class="card load">${load.map(l => html`<div class="load-row" key=${l.p.id}><span class="who"><${Av} id=${l.p.id} /><span>${l.p.name.split(' ')[0]}</span></span>
            <span class="bar" title=${`${l.total} em aberto, ${l.late} atrasadas`}><i class="late" style=${{ width: (l.late / max * 100) + '%' }}></i><i style=${{ width: ((l.total - l.late) / max * 100) + '%' }}></i></span>
            <span class="num">${l.total}${l.late ? html` · <span style="color:var(--st-late)">${l.late}</span>` : ''}</span></div>`)}
            <p class="muted" style="font-size:12px">Tarefas abertas mais peças em produção. Em vermelho, as atrasadas.</p></div>
        </section>
        <section class="sec"><div class="sec-h"><h2>Clientes</h2><span class="c">${db.clients.length}</span></div>
          <div class="ccards">${db.clients.map(c => {
            const w = [...db.posts, ...db.scripts].filter(x => x.clientId === c.id && x.status === 'cliente').length + db.tasks.filter(t => t.clientId === c.id && t.status === 'client').length;
            const nx = db.posts.filter(p => p.clientId === c.id && p.date && diff(p.date) >= 0 && ['agendado', 'aprovado'].includes(p.status)).sort((a, b) => a.date.localeCompare(b.date))[0];
            const ob = c.onboarding.filter(o => o.done).length;
            return html`<button class="ccard" key=${c.id} onClick=${() => go({ v: 'client', id: c.id, tab: 'overview' })}>

            </button>`; })}</div>

/* ---------- tarefas ---------- */
function TasksTab({ c }) {

  const dragged = drag && db.tasks.find(t => t.id === drag);

    setOver(null); if (!dragged || dragged.status === st) return;
    if (st === 'client' && dragged.type !== 'entrega') { toast('Tarefa interna não vai para o cliente. Abra a tarefa e marque como entrega.', null, 'warn'); return; }
    act.setTask(dragged.id, { status: st }, `Movida para ${stOf('task', st)[1]}`);
  };
  const addIn = st => { if (txt.trim()) act.addTask({ title: txt.trim(), status: st, clientId: c ? c.id : (cf || db.clients[0].id), assignee: me.id, due: null }); setTxt(''); setAdding(null); };

    </div>
    ${view === 'board' ? html`<div class="board">${TASK_ST.map(([st, label]) => {
      const col = tasks.filter(t => t.status === st);
      const nope = over === st && st === 'client' && dragged && dragged.type !== 'entrega';
      return html`<div key=${st} class=${cx('col', over === st && !nope && 'over', nope && 'nope')} onDragOver=${e => { e.preventDefault(); setOver(st); }} onDragLeave=${() => setOver(o => o === st ? null : o)} onDrop=${() => drop(st)}>
        <div class="col-h"><b>${label}</b><span class="c">${col.length}</span>${st === 'client' && html`<span class="hint">só entregas</span>`}</div>
        ${col.map(t => html`<div key=${t.id} class=${cx('kcard', drag === t.id && 'dragging')} draggable="true" onDragStart=${e => { setDrag(t.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', t.id); } catch (_) {} }} onDragEnd=${() => { setDrag(null); setOver(null); }} onClick=${() => open('task', t.id)} role="button" tabindex="0" onKeyDown=${e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open('task', t.id); } }}>
          <span class="t">${t.title}</span>
          ${!c && html`<${CChip} id=${t.clientId} />`}
          <span class="m">${t.req && html`<span class="tag">PEDIDO</span>`}${t.type === 'entrega' && html`<span class="tag">ENTREGA</span>`}${t.changeReq && html`<span class="pill t-adj">Ajuste</span>`}${t.priority === 'alta' && html`<span class="tag">ALTA</span>`}<${Due} date=${t.due} done=${t.status === 'done'} />${t.checklist.length > 0 && html`<span>${t.checklist.filter(x => x.done).length}/${t.checklist.length}</span>`}<${Av} id=${t.assignee} /></span>
        </div>`)}
        ${adding === st ? html`<textarea class="addin" ref=${autoF} placeholder="Título da tarefa" value=${txt} onInput=${e => setTxt(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); addIn(st); } if (e.key === 'Escape') { e.stopPropagation(); setAdding(null); } }} onBlur=${() => addIn(st)}></textarea>`
          : st !== 'client' && html`<button class="addcard" onClick=${() => { setAdding(st); setTxt(''); }}><${Icon} n="plus" s=${14} />Adicionar</button>`}

    </tbody></table></div>`}

/* ---------- calendário ---------- */
function calItems(db, cid, forClient) {
  const it = [];
  db.posts.filter(p => p.clientId === cid && p.date && (!forClient || POST_VISIBLE.includes(p.status))).forEach(p => it.push({ id: p.id, date: p.date, title: p.title, kind: 'post', k: 'post', cls: p.status === 'cliente' ? 'k-cli' : p.status === 'ajuste' ? 'k-adj' : ['aprovado', 'agendado', 'publicado'].includes(p.status) ? 'k-ok' : 'k-post', img: pieceCover(p), st: p.status }));
  db.scripts.filter(s => s.clientId === cid && s.record && (!forClient || SCRIPT_VISIBLE.includes(s.status))).forEach(s => it.push({ id: s.id, date: s.record, title: 'Gravação: ' + s.title, kind: 'script', k: 'script', cls: 'k-post', st: s.status }));
  db.tasks.filter(t => t.clientId === cid && t.due && (!forClient ? true : t.type === 'entrega')).forEach(t => it.push({ id: t.id, date: t.due, title: t.title, kind: t.type === 'entrega' ? 'entrega' : 'task', k: 'task', cls: t.status !== 'done' && diff(t.due) < 0 ? 'k-late' : t.type === 'entrega' ? 'k-cli' : 'k-task', st: t.status }));
  db.events.filter(e => e.clientId === cid).forEach(e => it.push({ id: e.id, date: e.date, title: `${e.time} ${e.title}`, kind: 'meet', cls: 'k-meet' }));
  return it;
}
function MonthGrid({ items, onOpen, lang = 'pt', month, setMonth, legend }) {
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const days = Array.from({ length: 42 }, (_, i) => { const x = new Date(start); x.setDate(start.getDate() + i); return x; });
  const wds = Array.from({ length: 7 }, (_, i) => new Intl.DateTimeFormat(LOC(lang), { weekday: 'short' }).format(new Date(2026, 0, 4 + i)).replace('.', ''));
  const byDay = {}; items.forEach(i => (byDay[i.date] = byDay[i.date] || []).push(i));
  const monthName = new Intl.DateTimeFormat(LOC(lang), { month: 'long', year: 'numeric' }).format(first);
  const agenda = Object.keys(byDay).filter(k => k.slice(0, 7) === iso(first).slice(0, 7)).sort(); const [openDay, setOpenDay] = useState(null);
  const t = TX[lang];
  const Ev = i => html`<button class=${'ev ' + i.cls} onClick=${() => onOpen(i)} title=${i.title}>${i.img && html`<img src=${i.img} alt="" />`}<span>${i.title}</span></button>`;
  return html`<div class="cal-wrap">
    <div class="mhead"><h2>${monthName}</h2>
      <button class="btn icon sm" aria-label="Mês anterior" onClick=${() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))}><${Icon} n="chevL" /></button>
      <button class="btn sm" onClick=${() => setMonth(new Date(T0.getFullYear(), T0.getMonth(), 1))}>${t.today}</button>
      <button class="btn icon sm" aria-label="Próximo mês" onClick=${() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))}><${Icon} n="chevR" /></button>
      <span style="flex:1"></span>${legend}</div>
    <div class="mgrid">${wds.map(w => html`<div class="wd" key=${w}>${w}</div>`)}
      ${days.map(x => { const k = iso(x); const its = byDay[k] || []; return html`<div key=${k} class=${cx('cell', x.getMonth() !== month.getMonth() && 'out', k === iso(T0) && 'today')}><span class="dn">${x.getDate()}</span>${its.slice(0, openDay === k ? its.length : 3).map(Ev)}${its.length > 3 && openDay !== k && html`<button class="more" onClick=${() => setOpenDay(k)}>+${its.length - 3}</button>`}</div>`; })}
    </div>
    <div class="agenda">${agenda.length ? agenda.map(k => html`<div class="ag-day" key=${k}><h3 class=${cx(diff(k) === 0 && 'today')}>${diff(k) === 0 ? t.today + ' · ' : ''}${fmt(k, lang, { weekday: 'long', day: 'numeric', month: 'long' })}</h3>
      ${byDay[k].map(i => html`<button key=${i.id} class=${'ag-item ' + i.cls} onClick=${() => onOpen(i)}><span class="kk"></span>${i.img && html`<img src=${i.img} alt="" />`}<span class="tt">${i.title}</span></button>`)}</div>`) : html`<div class="card empty">${t.nothingCal}</div>`}</div>
  </div>`;
}
const KINDS = [['post', 'Posts', 'k-ok'], ['entrega', 'Entregas', 'k-cli'], ['task', 'Tarefas internas', 'k-task'], ['script', 'Gravações', 'k-post'], ['meet', 'Reuniões', 'k-meet']];
function TeamCalendar({ c }) {

/* ---------- documentos ---------- */
function Editable({ tag = 'p', text, onSave, editable, ph, single }) {

  return html`<${T} key=${text} contenteditable="true" data-ph=${ph || 'Escreva aqui'} onBlur=${e => { const v = e.currentTarget.innerText.trim(); if (v !== text) onSave(v); }} onKeyDown=${e => { if (single && e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}>${text}<//>`;
}
function DocView({ page, editable, lang = 'pt', clientPage }) {

  return html`<article class="doc">
    <div class="dmeta">${editable && (clientPage ? html`<span class="vis"><${Icon} n="eye" s=${13} />O cliente vê esta página</span>` : html`<span class="vis"><${Icon} n="lock" s=${13} />Só o time vê</span>`)}
      <span>${editable ? `Atualizada por ${firstName(db, page.by)}, ${rel(page.at)}` : t.updated(firstName(db, page.by), rel(page.at, lang))}</span>${page.tpl && editable && html`<span class="tag">MODELO</span>`}</div>
    ${editable ? html`<h1 contenteditable="true" data-ph="Sem título" onBlur=${e => act.setPageTitle(page.id, e.currentTarget.innerText.trim())} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}>${page.title}</h1>` : html`<h1>${page.title}</h1>`}
    ${page.blocks.map((b, i) => {
      if (b.type === 'h2') return html`<${Editable} key=${i} tag="h2" text=${b.text} editable=${editable} single ph="Título" onSave=${v => save(i, { text: v })} />`;
      if (b.type === 'p') return html`<${Editable} key=${i} text=${b.text} editable=${editable} onSave=${v => save(i, { text: v })} />`;
      if (b.type === 'callout') return html`<div class="callout" key=${i}><${Icon} n="alert" s=${16} /><${Editable} text=${b.text} editable=${editable} onSave=${v => save(i, { text: v })} /></div>`;
      if (b.type === 'steps' || b.type === 'ul') { const L = b.type === 'steps' ? 'ol' : 'ul'; return html`<${L} key=${i} class=${b.type === 'steps' ? 'steps' : ''}>${b.items.map((it, j) => html`<${Editable} key=${j} tag="li" text=${it} editable=${editable} single onSave=${v => listSave(i, j, v)} />`)}<//>`; }
      if (b.type === 'check') return html`<div class="checks" key=${i}>${b.items.map((it, j) => html`<div key=${j} class=${cx('ci', it.done && 'done')}><button class=${cx('chk sq', it.done && 'on')} disabled=${!editable} aria-label="Marcar" onClick=${() => { const items = b.items.map((x, k) => k === j ? { ...x, done: !x.done } : x); save(i, { items }); }}>${it.done && html`<${Icon} n="check" s=${12} />`}</button><${Editable} tag="span" text=${it.t} editable=${editable} single ph="Item" onSave=${v => { const items = b.items.map((x, k) => k === j ? { ...x, t: v } : x); save(i, { items }); }} /></div>`)}
        ${editable && html`<button class="addcard" onClick=${() => save(i, { items: [...b.items, { t: '', done: false }] })}><${Icon} n="plus" s=${14} />Item</button>`}</div>`;

function Slider({ imgs, title, ratio, idx, onIdx, overlay }) {
  const [i0, setI0] = useState(0); const x0 = useRef(null);
  const S = ratio ? { aspectRatio: String(ratio) } : null;
  if (!imgs.length) return html`<div class="slider" style=${S}><div class="noart"><small>Sem arte ainda</small><b>${title}</b><small>A arte aparece aqui quando o design subir</small></div></div>`;
  const i = Math.min(idx != null ? idx : i0, imgs.length - 1);
  const setI = n => { if (onIdx) onIdx(n); else setI0(n); };
  const go = n => setI(Math.max(0, Math.min(imgs.length - 1, n)));
  return html`<div class="slider" style=${S} onPointerDown=${e => { x0.current = e.clientX; }} onPointerUp=${e => { if (x0.current == null) return; const dx = e.clientX - x0.current; x0.current = null; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); }}>
      <img src=${imgs[i]} alt=${`${title}, slide ${i + 1} de ${imgs.length}`} draggable="false" />
      ${imgs.length > 1 && html`<span class="sl-count">${i + 1}/${imgs.length}</span>`}
      ${i > 0 && html`<button class="sl-nav l" aria-label="Slide anterior" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i - 1)}><${Icon} n="chevL" /></button>`}
      ${i < imgs.length - 1 && html`<button class="sl-nav r" aria-label="Próximo slide" onPointerDown=${e => e.stopPropagation()} onClick=${() => go(i + 1)}><${Icon} n="chevR" /></button>`}
      ${overlay}
    </div>
    ${imgs.length > 1 && html`<div class="dots">${imgs.map((_, kk) => html`<button key=${kk} class=${cx(kk === i && 'on')} aria-label=${`Slide ${kk + 1}`} onClick=${() => setI(kk)}></button>`)}</div>`}`;
}

function computeFunnel(nodes, edges) {
  const by = Object.fromEntries(nodes.map(n => [n.id, n]));
  const inE = {}, outE = {}; nodes.forEach(n => { inE[n.id] = []; outE[n.id] = []; });
  edges.forEach(e => { if (by[e.from] && by[e.to] && e.from !== e.to) { outE[e.from].push(e); inE[e.to].push(e); } });
  const deg = Object.fromEntries(nodes.map(n => [n.id, inE[n.id].length]));
  const q = nodes.filter(n => !deg[n.id]).map(n => n.id); const order = [];
  while (q.length) { const id = q.shift(); order.push(id); outE[id].forEach(e => { if (--deg[e.to] === 0) q.push(e.to); }); }
  const vol = {}, flow = {}, buyers = {}, rev = {};
  let invest = 0, varCost = 0, visits = 0, leads = 0, qual = 0, meetings = 0, sales = 0, revenue = 0;
  order.forEach(id => {
    const n = by[id]; const T = FN[n.type] || {}; let v = 0;
    if (T.kind === 'traffic') { const own = T.paid ? num(n.p.invest) / Math.max(num(n.p.cpc), 0.01) : num(n.p.visits); v += own; visits += own; if (T.paid) invest += num(n.p.invest); }
    inE[id].forEach(e => { v += flow[e.id] || 0; });
    vol[id] = v;
    if (T.kind === 'talk') varCost += v * num(n.p.cost);
    if (T.kind === 'buy') { const c = n.p.conv === '' || n.p.conv == null ? 100 : num(n.p.conv); buyers[id] = v * c / 100; rev[id] = buyers[id] * num(n.p.price); sales += buyers[id]; revenue += rev[id]; }
    if (n.type === 'lead') leads += v; if (n.type === 'qualificado') qual += v; if (n.type === 'reuniao') meetings += v;
    outE[id].forEach(e => { flow[e.id] = v * num(e.rate) / 100; });
  });
  return { vol, flow, buyers, rev, cycle: order.length !== nodes.length,
    t: { invest, varCost, cost: invest + varCost, visits, leads, qual, meetings, sales, revenue, cpMeet: meetings ? (invest + varCost) / meetings : null, cpl: leads ? (invest + varCost) / leads : null, roas: invest && revenue ? revenue / (invest + varCost) : null } };
}

function layoutFunnel(steps, links) {
  const n = steps.length; const indeg = Array(n).fill(0); links.forEach(l => { indeg[l.to]++; });

  while (q.length) { const i = q.shift(); links.filter(l => l.from === i).forEach(l => { depth[l.to] = Math.max(depth[l.to], depth[i] + 1); if (--deg[l.to] === 0) q.push(l.to); }); }

}

const TPL_GROUPS = [['casa', 'Da M&O'], ['classico', 'Clássicos de copy']];
const tplOf = k => SCRIPT_TPLS.find(t => t.key === k);
const isFree = s => s.tpl === 'livre';
const scriptEmpty = s => s.blocks.every(b => !b[1].trim());
function reflow(blocks, tpl) {
  if (tpl.key === 'livre' && blocks.length === 1 && !blocks[0][0]) return blocks;
  let secs = blocks.filter(b => b[1].trim());
  if (secs.length === 1 && !secs[0][0]) {
    const out = []; secs[0][1].split(/\n\s*\n/).forEach(par => { const [first, ...rest] = par.split('\n'); const lab = first.trim(); if (rest.length && lab.length < 40 && /\p{Lu}/u.test(lab) && lab === lab.toUpperCase()) out.push([lab, rest.join('\n')]); else if (out.length) out[out.length - 1][1] += '\n\n' + par; else out.push(['', par]); });

  }
  if (tpl.key === 'livre') return [['', secs.map(([l, t]) => l ? l.toUpperCase() + '\n' + t : t).join('\n\n')]];
  const out = tpl.blocks.map(([l]) => [l, '']); const put = (j, t) => { out[j][1] = out[j][1] ? out[j][1] + '\n\n' + t : t; };
  const rest = secs.filter(([l, t]) => { const j = l ? out.findIndex(o => o[0].toUpperCase() === l.toUpperCase()) : -1; if (j < 0) return true; put(j, t); return false; });

function Grow({ value, onInput, onBlur, placeholder, cls, id, label }) {

}

  </div>`;
}
