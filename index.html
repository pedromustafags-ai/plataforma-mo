<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Central M&amp;O</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var l=JSON.parse(localStorage.getItem('mo.look2')||'null');document.documentElement.dataset.theme=l&&(l.mode==='dark'||(l.mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F4F1;--surface:#FFFFFF;--surface-2:#EFEBE6;--hover:rgba(34,40,49,.05);--line:#E7E0D6;--line-strong:#D8CCBB;
  --text:#222831;--text-2:#454A52;--text-3:#665F56;
  --primary:#222831;--on-primary:#F4EBDD;--focus:#948979;--taupe:#948979;
  --side-bg:#EEE4D3;--side-text:#3E434B;--side-strong:#222831;--side-hover:#E6D9C3;--side-active:#DFD0B8;--side-line:#E3D6C2;--side-label:#655D52;
  --logo-c:#222831;--logo-m:#DFD0B8;--logo-w:#222831;
  --st-neu:#51565D;--st-neu-bg:#E6E3DF;--st-prog:#58488A;--st-prog-bg:#E7E2F1;--st-cli:#2D5A83;--st-cli-bg:#DFE8F1;
  --st-adj:#7E5410;--st-adj-bg:#F4E6CC;--st-ok:#2E6844;--st-ok-bg:#DCEBE0;--st-late:#9A3B2E;--st-late-bg:#F5E1DC;
  --toast-bg:#222831;--toast-fg:#F2F0EF;--toast-act:#DFD0B8;
  --scrim:rgba(24,28,34,.45);--media-bg:#1B2027;
  --shadow:0 1px 2px rgba(34,40,49,.06),0 12px 32px rgba(34,40,49,.12);
  --shadow-sm:0 1px 2px rgba(34,40,49,.07);
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#222831;--surface:#2A3039;--surface-2:#343A43;--hover:rgba(242,240,239,.05);--line:#363C45;--line-strong:#48505A;
  --text:#F2F0EF;--text-2:#DFD0B8;--text-3:#ABA497;
  --primary:#DFD0B8;--on-primary:#222831;--focus:#DFD0B8;
  --side-bg:#1B2027;--side-hover:#252B33;--side-active:#2F353E;--side-line:#262C34;
  --logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF;
  --st-neu:#CBC6BE;--st-neu-bg:#3A3F47;--st-prog:#C8BBEE;--st-prog-bg:#382F4E;--st-cli:#A3C4E6;--st-cli-bg:#29394B;
  --st-adj:#EAC47F;--st-adj-bg:#463A25;--st-ok:#A3D4B3;--st-ok-bg:#27402F;--st-late:#F2AE9F;--st-late-bg:#4A2F2C;
  --toast-bg:#F2F0EF;--toast-fg:#222831;--toast-act:#393E46;
  --scrim:rgba(0,0,0,.55);--media-bg:#15191F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#222831;--surface:#2A3039;--surface-2:#343A43;--hover:rgba(242,240,239,.05);--line:#363C45;--line-strong:#48505A;
  --text:#F2F0EF;--text-2:#DFD0B8;--text-3:#ABA497;
  --primary:#DFD0B8;--on-primary:#222831;--focus:#DFD0B8;
  --side-bg:#1B2027;--side-hover:#252B33;--side-active:#2F353E;--side-line:#262C34;
  --logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF;
  --st-neu:#CBC6BE;--st-neu-bg:#3A3F47;--st-prog:#C8BBEE;--st-prog-bg:#382F4E;--st-cli:#A3C4E6;--st-cli-bg:#29394B;
  --st-adj:#EAC47F;--st-adj-bg:#463A25;--st-ok:#A3D4B3;--st-ok-bg:#27402F;--st-late:#F2AE9F;--st-late-bg:#4A2F2C;
  --toast-bg:#F2F0EF;--toast-fg:#222831;--toast-act:#393E46;
  --scrim:rgba(0,0,0,.55);--media-bg:#15191F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);--shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-3)}
.tnum{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.logo{display:inline-block;line-height:0;flex:none}
.logo svg{display:block;height:100%;width:auto}
.logo .lc{fill:var(--logo-c)}.logo .lm{fill:var(--logo-m)}.logo .lw{fill:var(--logo-w)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.lg{height:48px;padding:0 20px;font-size:15px;border-radius:12px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--st-late)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:500;color:var(--text-2)}
.inp,.sel,.ta{width:100%;height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
.ta{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;color:var(--text-2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.7}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--st-neu-bg);color:var(--st-neu)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-prog{background:var(--st-prog-bg);color:var(--st-prog)}
.t-cli{background:var(--st-cli-bg);color:var(--st-cli)}
.t-adj{background:var(--st-adj-bg);color:var(--st-adj)}
.t-ok{background:var(--st-ok-bg);color:var(--st-ok)}
.t-late{background:var(--st-late-bg);color:var(--st-late)}
.t-done::before{width:7px;height:4px;border-radius:0;background:none;border-left:1.5px solid;border-bottom:1.5px solid;transform:rotate(-45deg) translate(1px,-1px)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;border:1px solid var(--line-strong);font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--text-2);white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font:600 10px/1 var(--mono);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.av.lg{width:40px;height:40px;font-size:13px}
.cmark{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--logo-c);color:var(--logo-m);font:600 9px/1 var(--mono)}
.cmark svg{width:100%;height:100%;display:block}
.cmark .lc{fill:var(--logo-c)}.cmark .lm{fill:var(--logo-m)}
.cmark.lg{width:44px;height:44px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.due{font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--st-late);font-weight:500}
.chk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-3);display:grid;place-items:center;background:none;flex:none;padding:0;color:var(--surface);transition:background .12s}
.chk:hover{border-color:var(--text)}
.chk.on{background:var(--st-ok);border-color:var(--st-ok)}
.chk.sq{border-radius:5px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--taupe)}
.bar>i.late{background:var(--st-late)}
.empty{padding:28px 16px;text-align:center;color:var(--text-3);font-size:13px}

/* ---------- login ---------- */
.login{min-height:100%;background:#222831;color:#F2F0EF;display:grid;place-items:center;padding:40px 16px;--logo-c:#DFD0B8;--logo-m:#222831;--logo-w:#F2F0EF}
.login-box{width:min(460px,100%);display:flex;flex-direction:column;gap:28px}
.login .logo{height:30px}
.login h1{font-size:30px;line-height:1.15}
.login p.lead{color:#C9C2B6;font-size:15px;margin-top:10px}
.login form{display:flex;gap:8px}
.login .inp{background:#2A3039;border-color:#48505A;color:#F2F0EF;height:44px}
.login .btn.pri{background:#DFD0B8;color:#222831;border-color:#DFD0B8;height:44px}
.login .sent{color:#C9C2B6;font-size:13px}
.login .label{color:#A8A195}
.roles{display:flex;flex-direction:column;gap:8px}
.role{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid #393E46;background:#2A3039;text-align:left;color:#F2F0EF;width:100%;transition:border-color .12s,background .12s}
.role:hover{border-color:#DFD0B8;background:#2F353E}
.role b{display:block;font-weight:600;font-size:15px}
.role small{display:block;color:#C9C2B6;font-size:13px;margin-top:2px}
.role .lvl{margin-left:auto;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#DFD0B8;border:1px solid #48505A;border-radius:6px;padding:4px 7px;white-space:nowrap}
.role .av{background:#393E46;color:#DFD0B8;border-color:#48505A}
.login .foot{font-size:12px;color:#A8A195}

/* ---------- casca do time ---------- */
.shell{display:grid;height:100%}
.side{background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;gap:2px;padding:16px 10px 12px;overflow-y:auto;--logo-c:var(--side-logo-c);--logo-m:var(--side-logo-m);--logo-w:var(--side-logo-w)}
.side .logo{height:22px;margin:2px 10px 16px;display:block}
.nav{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 10px;border-radius:8px;color:var(--side-text);border:0;background:none;width:100%;text-align:left;font-size:14px}
.nav:hover{background:var(--side-hover);color:var(--side-strong)}
.nav.on{background:var(--side-active);color:var(--side-strong);font-weight:500}
.nav .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--side-badge-fg);background:var(--side-badge-bg);border-radius:10px;padding:3px 6px}
.nav .n.soft{background:transparent;color:var(--side-label);padding:0}
.search-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--side-line);background:rgba(255,255,255,.03);color:var(--side-text);font-size:13px;width:100%;text-align:left}
.search-btn:hover{border-color:var(--side-line-strong);color:var(--side-strong)}
.search-btn kbd{margin-left:auto}
.side-label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--side-label);padding:18px 10px 8px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:6px 10px}
.me .av{background:var(--side-active);color:var(--side-strong);border-color:var(--side-line-strong)}
.me b{display:block;color:var(--side-strong);font-weight:500;font-size:13px}
.me small{display:block;color:var(--side-label);font-size:12px}
.proto{font-size:11px;color:var(--side-label);padding:2px 10px 0;line-height:1.4}
.main{height:100%;overflow-y:auto;min-width:0;position:relative}
.topbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--side-bg);color:var(--side-strong);position:sticky;top:0;z-index:20;--logo-c:var(--side-logo-c);--logo-m:var(--side-logo-m);--logo-w:var(--side-logo-w)}
.topbar .logo{height:18px}
.topbar .btn{color:var(--side-strong);border-color:transparent;background:transparent}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 72px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{font-size:24px;line-height:1.2}
.phead .sub{color:var(--text-3);margin-top:4px}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.scrim-side{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:284px;z-index:45;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim-side{display:block;position:fixed;inset:0;background:var(--scrim);z-index:44}
  .topbar{display:flex}
  .page{padding:20px 16px 88px;gap:20px}
  .phead h1{font-size:21px}
}

/* ---------- listas e seções ---------- */
.sec{display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;align-items:center;gap:10px;padding:0 4px 4px}
.sec-h h2{font-size:15px}
.sec-h .c{font:500 12px var(--mono);color:var(--text-3)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;min-width:0}
.row:hover{background:var(--hover)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{color:var(--text-3);text-decoration:line-through}
.row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.cchip .cmark{width:16px;height:16px;font-size:7px}
.quick{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.quick input{flex:1;border:0;background:none;height:34px;min-width:0}
.quick input:focus{outline:none}
.quick .sel{width:auto;height:30px;font-size:13px;border-color:var(--line)}
.callback{border:1px solid var(--st-adj-bg);background:color-mix(in srgb,var(--st-adj-bg) 45%,var(--surface));border-radius:12px;padding:4px}
.quote{font-size:13px;color:var(--text-2);border-radius:6px;background:var(--surface-2);padding:6px 9px;margin-top:4px}

/* visão geral */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat b{font:600 26px/1 var(--sans);font-variant-numeric:tabular-nums}
.stat small{color:var(--text-3);font-size:12px}
.stat .k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);font-weight:500}
.stat .dot{width:8px;height:8px;border-radius:50%}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1040px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stuck .why{font-size:12px;font-weight:500}
.load{display:flex;flex-direction:column;gap:14px;padding:16px}
.load-row{display:grid;grid-template-columns:132px 1fr 56px;gap:12px;align-items:center;font-size:13px}
.load-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.load-row .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load-row .num{text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums}
.ccards{display:flex;flex-direction:column;gap:10px}
.ccard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ccard:hover{border-color:var(--line-strong)}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.ccard .facts b{color:var(--text);font-weight:600}

/* área do cliente */
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chead h1{font-size:24px}
.chead .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .c{font:500 11px var(--mono);color:var(--text-3)}
.ov{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1040px){.ov{grid-template-columns:minmax(0,1fr)}}
.side-col{display:flex;flex-direction:column;gap:20px}
.onb{padding:16px;display:flex;flex-direction:column;gap:12px}
.onb-item{display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.onb-item.done span{color:var(--text-3);text-decoration:line-through}
.kv{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0}

/* quadro */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .spacer{flex:1}
.people-filter{display:flex;gap:4px}
.people-filter button{border:0;background:none;padding:2px;border-radius:50%}
.people-filter button.on .av{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;transition:outline-color .1s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{outline-color:var(--taupe)}
.col.nope{outline-color:var(--st-late)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.col-h b{font-size:13px;font-weight:600}
.col-h .c{font:500 12px var(--mono);color:var(--text-3)}
.col-h .hint{margin-left:auto;font-size:11px;color:var(--text-3)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:var(--shadow-sm);text-align:left;width:100%}
.kcard:hover{border-color:var(--line-strong)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.kcard .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.kcard .m .av{margin-left:auto;width:22px;height:22px}
.addcard{border:0;background:none;color:var(--text-3);text-align:left;padding:6px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px}
.addcard:hover{background:var(--hover);color:var(--text)}
.addin{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;resize:none;min-height:60px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl th{text-align:left;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .grp td{background:var(--surface-2);font-weight:600;font-size:12px;cursor:default}
.tbl .grp:hover td{background:var(--surface-2)}

/* postagens */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px 16px}
.pcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#222831;position:relative;border:1px solid var(--line);width:100%;transition:transform .15s,box-shadow .15s}
.pcard:hover .thumb{transform:translateY(-2px);box-shadow:var(--shadow)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pill{position:absolute;top:8px;left:8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.noart{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#F4EBDD}
.noart b{font-size:17px;line-height:1.2;font-weight:600;text-wrap:balance}
.noart small{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#A8A195}
.pcard .pt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pcard .pd{font-size:12px;color:var(--text-3)}
.newcard{aspect-ratio:4/5;border:1.5px dashed var(--line-strong);border-radius:10px;display:grid;place-items:center;color:var(--text-3);background:none;width:100%}
.newcard:hover{color:var(--text);border-color:var(--text-3)}

/* roteiros */
.slist{display:flex;flex-direction:column;gap:10px}
.scard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scard:hover{border-color:var(--line-strong)}
.scard .t{font-weight:600;font-size:15px}
.scard .hook{grid-column:1/-1;color:var(--text-2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.scard .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* calendário */
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhead h2{font-size:17px;min-width:160px;text-transform:capitalize}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;color:var(--text-2)}
.lg-btn.off{opacity:.45}
.lg-btn i{width:8px;height:8px;border-radius:2px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.mgrid .wd{background:var(--surface);padding:8px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);text-align:center}
.cell{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.cell.out .dn{color:var(--text-3);opacity:.6}
.dn{font:500 12px var(--mono);color:var(--text-2);padding:2px 4px;align-self:flex-start;border-radius:6px}
.cell.today .dn{background:var(--primary);color:var(--on-primary)}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.25;padding:3px 5px;border-radius:5px;border:0;text-align:left;width:100%;min-width:0;background:var(--k-bg,var(--surface-2));color:var(--k-fg,var(--text))}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev img{width:14px;height:17px;object-fit:cover;border-radius:2px;flex:none}
.more{font-size:11px;color:var(--text-3);padding:0 5px}
.k-post{--k-bg:var(--st-prog-bg);--k-fg:var(--st-prog)}
.k-ok{--k-bg:var(--st-ok-bg);--k-fg:var(--st-ok)}
.k-cli{--k-bg:var(--st-cli-bg);--k-fg:var(--st-cli)}
.k-adj{--k-bg:var(--st-adj-bg);--k-fg:var(--st-adj)}
.k-meet{--k-bg:var(--surface-2);--k-fg:var(--text)}
.k-task{--k-bg:var(--st-neu-bg);--k-fg:var(--st-neu)}
.k-late{--k-bg:var(--st-late-bg);--k-fg:var(--st-late)}
.agenda{display:none;flex-direction:column;gap:14px}
.ag-day{display:flex;flex-direction:column;gap:6px}
.ag-day h3{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.ag-day h3.today{color:var(--text)}
.ag-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.ag-item img{width:32px;height:40px;object-fit:cover;border-radius:4px}
.ag-item .tt{font-weight:500;flex:1;min-width:0}
.ag-item .kk{width:4px;align-self:stretch;border-radius:2px;background:var(--k-fg)}
@media (max-width:760px){.cal-wrap .mgrid{display:none}.cal-wrap .agenda{display:flex}}

/* documentos */
.docs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.docs{grid-template-columns:minmax(0,1fr)}}
.doclist{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
@media (max-width:900px){.doclist{position:static;flex-direction:row;overflow-x:auto;gap:6px}}
.docbtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;color:var(--text-2);font-weight:500;white-space:nowrap}
.docbtn:hover{background:var(--hover);color:var(--text)}
.docbtn.on{background:var(--surface-2);color:var(--text)}
.doc{max-width:720px;display:flex;flex-direction:column;gap:14px}
.doc .dmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.doc .vis{display:inline-flex;align-items:center;gap:6px}
.doc h1{font-size:28px;line-height:1.15}
.doc h2{font-size:18px;margin-top:10px}
.doc p,.doc li{font-size:15px;line-height:1.65;color:var(--text)}
.doc p{white-space:pre-wrap}
.doc ul,.doc ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.doc ol.steps{list-style:none;padding:0;counter-reset:s;gap:8px}
.doc ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline}
.doc ol.steps li::before{content:counter(s,decimal-leading-zero);font:500 12px var(--mono);color:var(--text-3)}
.doc .callout{display:flex;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.doc .callout p{font-size:14px}
.doc .checks{display:flex;flex-direction:column;gap:6px}
.doc .checks .ci{display:flex;gap:10px;align-items:flex-start}
.doc .checks .ci .chk{margin-top:3px}
.doc .checks .ci.done span{color:var(--text-3);text-decoration:line-through}
[contenteditable="true"]{outline:none;border-radius:4px;transition:background .1s}
[contenteditable="true"]:hover{background:var(--hover)}
[contenteditable="true"]:focus{background:var(--hover);box-shadow:0 0 0 2px var(--hover)}
[contenteditable="true"]:empty::before{content:attr(data-ph);color:var(--text-3)}
.addblock{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px;border-top:1px dashed var(--line);margin-top:6px}

/* links */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.lcard .fav{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:600 13px var(--mono);color:var(--text-2);flex:none}
.lcard .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .url{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .body{flex:1;min-width:0}
.lcard a.btn{text-decoration:none}
.lform{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:end}
@media (max-width:760px){.lform{grid-template-columns:1fr}}

/* equipe */
.lvl-tbl td:not(:first-child),.lvl-tbl th:not(:first-child){text-align:center;width:120px}
.yes{color:var(--st-ok);font-weight:600}
.no{color:var(--text-3)}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{padding:16px;display:flex;flex-direction:column;gap:12px}
.person .top{display:flex;gap:12px;align-items:center}
.person .top b{display:block;font-size:15px}
.person .top small{color:var(--text-3)}
.person .facts{display:flex;gap:16px;font-size:12px;color:var(--text-3)}
.person .facts b{color:var(--text);font-size:15px;display:block;font-variant-numeric:tabular-nums}

/* inbox */
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 12px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.note:hover{background:var(--hover)}
.note .txt{flex:1;min-width:0}
.note .txt b{font-weight:600}
.note .when{font-size:12px;color:var(--text-3);white-space:nowrap}
.note .unread{width:8px;height:8px;border-radius:50%;background:var(--st-cli);margin-top:8px;flex:none}
.note.read .unread{visibility:hidden}
.note.read .txt{color:var(--text-2)}

/* gaveta, modal, paleta, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.drawer{width:min(760px,100%);height:100%;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .18s ease}
.drawer.narrow{width:min(620px,100%)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);min-width:0;flex:1}
.dbody{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:22px}
.dtitle{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.props{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;align-items:center;font-size:13px}
.props dt{color:var(--text-3)}
.props dd{margin:0;min-width:0}
.props .sel,.props .inp{height:32px;font-size:13px;max-width:280px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper span{height:4px;flex:1;min-width:18px;border-radius:2px;background:var(--surface-2)}
.stepper span.on{background:var(--taupe)}
.primary-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.primary-act .hint{font-size:13px;color:var(--text-2);flex:1;min-width:180px}
.pd-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.pd-grid{grid-template-columns:minmax(0,1fr)}.dbody{padding:16px 16px 40px}.props{grid-template-columns:100px minmax(0,1fr)}}
.caption{font-size:14px;line-height:1.6;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cta{font:400 12px/1.5 var(--mono);color:var(--text-3)}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist .ci{display:flex;gap:10px;align-items:center;font-size:14px}
.checklist .ci.done span{color:var(--text-3);text-decoration:line-through}
.checklist .ci .chk{border-radius:5px}
.comments{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px}
.cmt .bub{flex:1;min-width:0}
.cmt .who{font-size:12px;color:var(--text-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmt .who b{color:var(--text);font-weight:600}
.cmt .txt{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.cmt.client .bub{background:var(--st-adj-bg);color:var(--st-adj);border-radius:10px;padding:8px 12px}
.cmt.client .who b,.cmt.client .txt{color:inherit}
.cmt.client .who{color:inherit;opacity:.9}
.mention{font-weight:600;color:var(--st-cli)}
.cform{display:flex;gap:8px;align-items:flex-end}
.cform .ta{min-height:40px;height:40px}
.script-blocks{display:flex;flex-direction:column;gap:14px}
.sblock{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.sblock .label{padding-top:4px}
.sblock p{font-size:15px;line-height:1.65;white-space:pre-wrap}
@media (max-width:600px){.sblock{grid-template-columns:minmax(0,1fr);gap:4px}}
.confirm-del{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}

.modal-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:16px;animation:fade .15s ease}
.modal{width:min(540px,100%);max-height:calc(100% - 16px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);animation:pop .18s ease}
.mhd{padding:20px 22px 4px;display:flex;align-items:flex-start;gap:12px}
.mhd h2{font-size:18px;flex:1}
.mhd p{color:var(--text-3);margin-top:4px;font-size:13px}
.mbd{padding:16px 22px;display:flex;flex-direction:column;gap:14px}
.mft{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.msg{background:var(--st-ok-bg);color:var(--text);border-radius:12px 12px 12px 4px;padding:12px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg .lnk{font:500 12px var(--mono);background:var(--surface);border-radius:5px;padding:1px 6px;color:var(--st-cli)}
.wa{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}

.pal{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .12s ease}
.pal-box{width:min(640px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:pop .15s ease}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;background:none;height:54px;font-size:16px;min-width:0}
.pal-in input:focus{outline:none}
.pal-res{max-height:min(420px,55vh);overflow-y:auto;padding:6px}
.pal-grp{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 4px}
.pal-it{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.pal-it.on{background:var(--surface-2)}
.pal-it .sub{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.pal-it span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}

.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--toast-bg);color:var(--toast-fg);border-radius:10px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:14px;animation:pop .18s ease}
.toast button{border:0;background:none;color:var(--toast-act);font-weight:600;padding:4px 8px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.toast.warn{outline:2px solid var(--st-adj)}

/* ---------- prévia como cliente ---------- */
.pv{position:fixed;inset:0;z-index:55;background:#15191F;display:flex;flex-direction:column;animation:fade .15s ease}
.pv-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#F2F0EF;flex-wrap:wrap}
.pv-bar .ttl{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;min-width:200px}
.pv-bar .seg{background:#2A3039}
.pv-bar .seg button{color:#C9C2B6}
.pv-bar .seg button.on{background:#393E46;color:#F2F0EF}
.pv-bar .btn{background:#2A3039;border-color:#393E46;color:#F2F0EF}
.pv-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px 20px;min-height:0;overflow:auto}
.device{background:var(--bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.device.mobile{width:390px;max-width:100%;height:min(820px,calc(100vh - 120px));min-height:520px;border-radius:40px;border:10px solid #0B0D10;flex:none}
.device.desktop{width:min(1180px,100%);height:calc(100vh - 110px);min-height:480px;border-radius:12px;flex:none}

/* ---------- portal do cliente ---------- */
.portal{container:portal/inline-size;height:100%;display:flex;flex-direction:column;background:var(--bg)}
.p-top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.p-top .logo{height:20px}
.p-top .cn{font-weight:600;color:var(--text-2);padding-left:12px;border-left:1px solid var(--line-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.p-top .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.p-top .seg button{height:26px;padding:0 9px;font:500 11px var(--mono);letter-spacing:.06em}
.p-menu{position:relative}
.p-menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:10;display:flex;flex-direction:column}
.p-menu .pop button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center}
.p-menu .pop button:hover{background:var(--hover)}
.p-tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.p-tab{border:0;background:none;padding:12px 12px 11px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;position:relative}
.p-tab:hover{color:var(--text)}
.p-tab.on{color:var(--text);border-bottom-color:var(--text)}
.p-tab .badge{font:600 11px/1 var(--mono);background:var(--st-cli);color:var(--surface);border-radius:9px;padding:3px 6px}
.p-scroll{flex:1;overflow-y:auto;min-height:0}
.p-body{max-width:780px;margin:0 auto;padding:36px 28px 72px;display:flex;flex-direction:column;gap:28px}
.hello h1{font-size:30px;line-height:1.15;letter-spacing:-.02em}
.hello p{color:var(--text-2);font-size:16px;margin-top:8px}
.aps{display:flex;flex-direction:column;gap:18px}
.ap{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.ap-h{padding:18px 20px 14px;display:flex;flex-direction:column;gap:6px}
.ap-h .k{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.ap-h h2{font-size:19px;line-height:1.25}
.ap-media{background:var(--media-bg);padding:18px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ap-b{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.ap-b .from{font-size:12px;color:var(--text-3)}
.ap-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 20px}
.ap-acts .btn{height:48px;font-size:15px;border-radius:12px}
.chg{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;min-width:36px;padding:0 10px;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface);font:500 12px var(--mono)}
.chips button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.done-row{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.done-row .okc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--st-ok-bg);color:var(--st-ok);flex:none}
.done-row.chg-sent .okc{background:var(--st-adj-bg);color:var(--st-adj)}
.done-row .t{flex:1;min-width:0}
.done-row .t b{display:block}
.done-row .t small{color:var(--text-3)}
.allclear{padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.allclear .okc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--st-ok-bg);color:var(--st-ok)}
.allclear b{font-size:17px}
.upnext{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sblk-read{display:flex;flex-direction:column;gap:12px}
.sblk-read .label{margin-bottom:4px}
.sblk-read p{font-size:15px;line-height:1.65}
.linkbtn{border:0;background:none;padding:0;color:var(--text-2);font-weight:500;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.slider{position:relative;width:min(360px,calc(100% - 32px));aspect-ratio:4/5;border-radius:10px;overflow:hidden;touch-action:pan-y;user-select:none;background:#222831}
.slider img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(242,240,239,.92);color:#222831;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.sl-nav.l{left:10px}.sl-nav.r{right:10px}
.sl-count{position:absolute;top:10px;right:10px;background:rgba(21,25,31,.72);color:#F2F0EF;font:500 11px var(--mono);padding:3px 7px;border-radius:10px}
.dots{display:flex;gap:6px}
.dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:#48505A}
.dots button.on{background:#DFD0B8}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;color:var(--text-2)}
.filter-chips button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cal-wrap{display:flex;flex-direction:column;gap:14px}
@container portal (max-width:680px){
  .p-top{padding:10px 16px}
  .p-top .logo{height:17px}
  .p-top .cn{display:none}
  .p-tabs{order:3;border-bottom:0;border-top:1px solid var(--line);justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible}
  .p-tab{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;border-bottom:0;flex:1;min-width:0}
  .p-tab.on{color:var(--text)}
  .p-tab.on .ic{stroke-width:2.2}
  .p-tab .badge{position:absolute;top:2px;left:calc(50% + 6px);padding:2px 5px;font-size:10px}
  .p-body{padding:22px 16px 32px;gap:22px}
  .hello h1{font-size:25px}
  .hello p{font-size:15px}
  .ap-h{padding:16px 16px 12px}
  .ap-b{padding:14px 16px}
  .ap-acts{padding:0 16px 16px}
  .chg{padding:0 16px 16px}
  .ap-media{padding:0}
  .slider{width:100%;border-radius:0}
  .cal-wrap .mgrid{display:none}
  .cal-wrap .agenda{display:flex}
  .p-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .docs{grid-template-columns:minmax(0,1fr)}
  .doclist{position:static;flex-direction:row;overflow-x:auto}
  .doc h1{font-size:23px}
}
@container portal (min-width:681px){.p-tab .ic{display:none}}

/* ---------- v2: barra lateral ---------- */
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 14px 10px}
.side-head .logo{height:22px;margin:0}
.rail-btn{border:0;background:none;color:var(--side-label);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.rail-btn:hover{background:var(--side-hover);color:var(--side-strong)}
.side-actions{display:flex;gap:6px;margin-bottom:10px}
.side-actions .p-menu{flex:none}
.act-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--side-line);background:rgba(255,255,255,.03);color:var(--side-text);font-size:13px;font-weight:500;white-space:nowrap;width:100%}
.act-btn:hover{color:var(--side-strong);border-color:var(--side-line-strong)}
.act-btn.cp{flex:1}
.act-btn.cp.on{background:var(--side-badge-bg);color:var(--side-badge-fg);border-color:var(--side-badge-bg)}
.act-btn kbd{margin-left:auto}
.side-actions > .act-btn{width:auto}
.side-sec{display:flex;flex-direction:column;gap:2px}
.sec-row{display:flex;align-items:center}
.sec-btn{display:flex;align-items:center;gap:6px;border:0;background:none;flex:1;text-align:left}
.sec-btn:hover{color:var(--side-strong)}
.chev{display:inline-flex;transition:transform .15s}
.chev.shut{transform:rotate(-90deg)}
.sec-add{border:0;background:none;color:var(--side-label);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;margin:10px 4px 0 0}
.sec-add:hover{background:var(--side-hover);color:var(--side-strong)}
.nav .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tree-row{padding:0;gap:0;cursor:default}
.tree-tog{border:0;background:none;color:var(--side-label);width:24px;height:34px;display:grid;place-items:center;flex:none;padding:0}
.tree-tog:hover{color:var(--side-strong)}
.tree-main{border:0;background:none;color:inherit;display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:34px;padding:0 10px 0 2px;text-align:left;font:inherit}
.tree-kids{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 22px;padding-left:8px;border-left:1px solid var(--side-line)}
.nav.kid{min-height:30px;font-size:13px;padding:4px 8px}
.new-pop{left:0;right:auto;min-width:220px;color:var(--text)}
.side-pop{left:0;right:auto;bottom:calc(100% + 6px);top:auto;width:270px;max-height:70vh;overflow:auto;padding:12px;gap:8px;color:var(--text)}
.pop-h{display:flex;align-items:center;justify-content:space-between}
.pref-sec{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.pref-h{display:flex;align-items:center;font-size:13px}
.pref-it{display:flex;gap:8px;align-items:center;font-size:13px;padding:2px 0;cursor:pointer}
.shell{grid-template-columns:var(--side-w,256px) minmax(0,1fr) var(--cp-w,0px)}
.shell.cp{--cp-w:400px}
@media (min-width:881px){
  .shell.rail{--side-w:64px}
  .shell.rail .side{padding:14px 8px}
  .shell.rail .side .lb,.shell.rail .side kbd,.shell.rail .side .side-label,.shell.rail .side .n,.shell.rail .sec-add,.shell.rail .tree-tog,.shell.rail .tree-kids,.shell.rail .side-head .logo{display:none}
  .shell.rail .side-head{justify-content:center;margin:2px 0 12px}
  .shell.rail .nav,.shell.rail .search-btn,.shell.rail .act-btn,.shell.rail .tree-main{justify-content:center;padding:0}
  .shell.rail .side-actions{flex-direction:column}
  .shell.rail .me{justify-content:center;padding:6px 0}
  .shell.rail .side-sec{border-top:1px solid var(--side-line);padding-top:6px;margin-top:6px}
}
@media (max-width:1100px){.shell.cp{--cp-w:0px}.shell > .copilot{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);z-index:48;box-shadow:var(--shadow)}}
@media (min-width:1101px){body.cp-open .scrim,body.cp-open .modal-wrap,body.cp-open .pal{right:400px}}
.fav.on{color:var(--st-adj)}
.fav.on svg{fill:currentColor}

/* ---------- v2: copiloto ---------- */
.copilot{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;min-height:0;min-width:0}
.copilot.floating{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);z-index:20;box-shadow:var(--shadow)}
.cp-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.cp-mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.cp-ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.cp-ttl small{color:var(--text-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.cp-empty{display:flex;flex-direction:column;gap:14px;padding:6px 0}
.cp-empty b{font-size:15px;font-weight:600;line-height:1.4;text-wrap:balance}
.cp-sugs{display:flex;flex-direction:column;gap:6px}
.cp-sugs button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;text-align:left;font-size:13px;color:var(--text-2)}
.cp-sugs button:hover{border-color:var(--line-strong);color:var(--text)}
.cp-u{align-self:flex-end;max-width:85%;background:var(--primary);color:var(--on-primary);border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.cp-a{display:flex;flex-direction:column;gap:10px;max-width:100%}
.cp-md{font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.cp-md ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ref{border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:0 6px;font:inherit;font-size:13px;font-weight:500;color:var(--text);line-height:1.5;text-align:left}
.ref:hover{border-color:var(--text-3)}
.cp-think{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-3)}
.dot1{width:5px;height:5px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.dot1:nth-child(2){animation-delay:.2s}.dot1:nth-child(3){animation-delay:.4s;margin-right:6px}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cp-prop{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;background:var(--bg);flex-wrap:wrap}
.cp-prop b{display:block;font-size:14px;margin-top:4px}
.cp-prop small{color:var(--text-3);font-size:12px}
.cp-prop-a{display:flex;gap:6px}
.cp-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line)}
.cp-in textarea{flex:1;resize:none;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;background:var(--bg);min-height:40px;max-height:140px;line-height:1.45}
.cp-in textarea:focus{outline:2px solid var(--focus);border-color:transparent}
.cp-foot{font-size:11px;color:var(--text-3);padding:0 14px 10px}
.err{color:var(--st-late);font-size:13px}
.portal{position:relative;color:var(--text)}

/* ---------- v2: telas de lousa ---------- */
.main.full{overflow:hidden;display:flex;flex-direction:column}
.canvas-page{flex:1;display:flex;flex-direction:column;min-height:0}
.cv-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.cv-head .spacer{flex:1}
.cv-title{font-weight:600;font-size:16px;padding:2px 6px;border-radius:6px;min-width:40px}
.cv-hint{font-size:12px}
@media (max-width:900px){.cv-hint{display:none}}
.cv-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);touch-action:none}
.cv-svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.cv-toolbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);max-width:calc(100% - 24px);overflow-x:auto}
.tl{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--text-2);display:grid;place-items:center;flex:none}
.tl:hover{background:var(--hover);color:var(--text)}
.tl.on{background:var(--primary);color:var(--on-primary)}
.tl.pct{width:auto;padding:0 8px;font:500 12px var(--mono)}
.tl-sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.14);flex:none;padding:0;margin:0 2px}
.sw.on{outline:2px solid var(--text);outline-offset:1px}
.cv-zoom{position:absolute;right:16px;bottom:18px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow-sm)}
.cv-zoom .tl{width:32px;height:32px}
@media (max-width:760px){.cv-zoom{bottom:84px}}
.cv-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;color:var(--text-3);pointer-events:none;padding:16px}
.cv-empty b{color:var(--text-2);font-size:16px}
.cv-warn{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--st-adj-bg);color:var(--st-adj);padding:8px 12px;border-radius:10px;font-size:13px;max-width:calc(100% - 24px)}
.wb-sticky{filter:url(#wbsh)}
.wb-shape{fill:var(--surface);stroke:var(--text-2);stroke-width:1.5}
.wb-arrow{stroke:var(--text-2);stroke-width:2;fill:none}
.wb-arrow.sel,.wb-pen.sel{stroke:var(--st-cli)}
.wb-selbox{fill:none;stroke:var(--st-cli);stroke-width:1.5;stroke-dasharray:5 4}
.wb-marq{fill:color-mix(in srgb,var(--st-cli) 12%,transparent);stroke:var(--st-cli);stroke-width:1}
.wb-handle{fill:var(--surface);stroke:var(--st-cli);stroke-width:1.5;cursor:nwse-resize}
.wb-st-text,.wb-text,.wb-shape-text{width:100%;height:100%;padding:12px 14px;font:500 15px/1.4 var(--sans);color:#222831;overflow:hidden;outline:none;word-break:break-word;box-sizing:border-box;white-space:pre-wrap}
.wb-text{padding:4px 2px;color:var(--text);font-weight:600;line-height:1.2}
.wb-shape-text{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text);font-size:14px}
.wb-st-text[contenteditable="true"],.wb-text[contenteditable="true"],.wb-shape-text[contenteditable="true"]{cursor:text;box-shadow:none}
.wb-st-text:empty::before,.wb-text:empty::before{content:attr(data-ph);opacity:.45}
.wb-seltools{position:absolute;z-index:5;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}

/* ---------- v2: quadros e funis ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bcard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.bcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.bthumb{aspect-ratio:16/9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px}
.bthumb svg{width:100%;height:100%;display:block}
.bt{font-weight:600;padding:12px 14px 4px}
.bd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 14px 14px;font-size:12px;color:var(--text-3)}
.fn-layout{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr) 280px;min-height:0}
.fn-pal{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.fn-pal .label{display:block;padding:0 6px 6px}
.fn-pi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px;border-radius:8px;text-align:left;font-size:13px;cursor:grab;color:var(--text)}
.fn-pi:hover{background:var(--hover)}
.fn-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--st-neu-bg);color:var(--st-neu)}
.fn-card{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.fn-card.goal{stroke:var(--text);stroke-width:2}
.fn-card.on{stroke:var(--st-cli);stroke-width:2.5}
.fn-node{cursor:grab}
.fn-body{display:flex;align-items:center;gap:10px;height:100%;padding:0 16px 0 12px;box-sizing:border-box;pointer-events:none;font-family:var(--sans)}
.fn-txt{display:flex;flex-direction:column;min-width:0;gap:2px}
.fn-txt b{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-txt small{font:500 11.5px var(--mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn-port{fill:var(--surface);stroke:var(--text-3);stroke-width:1.5;cursor:crosshair}
.fn-port:hover{fill:var(--primary)}
.fn-in{fill:var(--text-3)}
.fn-line{fill:none;stroke:var(--text-3);stroke-width:1.6}
.fn-line.on{stroke:var(--text);stroke-width:2.2}
.fn-edge{cursor:pointer}
.fn-lab{fill:var(--surface);stroke:var(--line-strong)}
.fn-lab.on{stroke:var(--text)}
.fn-lab-t{font:500 11px var(--mono);fill:var(--text-2)}
.fn-forecast{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow-x:auto;box-shadow:var(--shadow-sm)}
.fc{background:var(--surface);padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:108px}
.fc span{font-size:11px;color:var(--text-3);white-space:nowrap}
.fc b{font:600 15px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.fc.goal{background:var(--primary);color:var(--on-primary);min-width:170px}
.fc.goal span{color:inherit;opacity:.85}
.fn-canvas .cv-zoom{bottom:88px}
.fn-insp{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px}
.insp-h{display:flex;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.insp-stat{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:10px;padding:10px 12px}
.insp-stat span{font-size:12px;color:var(--text-3)}
.insp-stat b{font:600 18px var(--sans);font-variant-numeric:tabular-nums}
.insp-stat small{font-size:11.5px;color:var(--text-3)}
.insp-stat.goal{background:var(--primary);color:var(--on-primary)}
.insp-stat.goal span,.insp-stat.goal small{color:inherit;opacity:.85}
.insp-edge{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;margin-top:6px;font-size:13px}
.insp-edge .inp{height:30px}
.tips{margin:0;padding-left:18px;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:4px}
.callout-s{display:flex;gap:8px;background:var(--st-adj-bg);color:var(--st-adj);border-radius:10px;padding:10px 12px;font-size:13px}
.field small{font-size:11.5px}
@media (max-width:1180px){.fn-layout{grid-template-columns:180px minmax(0,1fr) 260px}}
@media (max-width:900px){
  .fn-layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- v2: reuniões e automações ---------- */
.int-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.int-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}

.mt-time{display:flex;flex-direction:column;width:64px;flex:none}

.src{display:inline-flex;gap:4px;align-items:center}
.mt-links{display:flex;gap:8px;flex-wrap:wrap}
.mt-links a{text-decoration:none}
.mt-note{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mt-note ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mt-note .ci{align-items:flex-start;flex-wrap:wrap}
details.tx summary{cursor:pointer;color:var(--text-2);font-size:13px}
details.tx pre{white-space:pre-wrap;font:13px/1.55 var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 0;max-height:260px;overflow:auto}
.auto{padding:18px;display:flex;flex-direction:column;gap:14px}
.auto-h{display:flex;gap:16px;align-items:flex-start}
.auto-h > div{flex:1}
.auto-h p{font-size:13px;margin-top:2px}
.switch{width:42px;height:24px;border-radius:12px;border:0;background:var(--surface-2);position:relative;flex:none;padding:0}
.switch i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);transition:left .15s}
.switch.on{background:var(--st-ok)}
.switch.on i{left:21px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
.flow li{position:relative;display:flex;align-items:center;gap:8px;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.flow li + li::before{content:"";position:absolute;left:-17px;top:50%;width:12px;height:1.5px;background:var(--text-3)}
.fl-i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);flex:none}
.auto-note{font-size:13px;color:var(--text-2);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.55}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr)}}

/* ---------- v3: marca, temas, idiomas, IA ---------- */
:root{--side-line-strong:#48505A;--side-badge-bg:#DFD0B8;--side-badge-fg:#222831;--side-logo-c:#DFD0B8;--side-logo-m:#222831;--side-logo-w:#F2F0EF}
.c-logo{display:block;height:30px;width:auto;max-width:190px;object-fit:contain}
.c-mono{display:inline-flex;align-items:center;gap:10px}
.c-mono .cmark{width:28px;height:28px;font-size:11px}
.c-mono b{font-size:15px;font-weight:600;color:var(--text)}
.p-brand{border:0;background:none;padding:0;display:flex;align-items:center;min-width:0;height:34px}
.p-brand .logo{height:22px}
.p-req span{white-space:nowrap}

.lang-btn{gap:5px}
.pop-foot{border-top:1px solid var(--line);margin-top:4px;padding:8px 10px 4px}
.powered{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.powered b{font-weight:600;color:var(--text-2)}
.pw-mark{width:16px;height:16px;border-radius:50%;overflow:hidden;display:inline-grid;flex:none}
.pw-mark svg{width:100%;height:100%;display:block}
.pw-mark .lc{fill:var(--logo-c)}.pw-mark .lm{fill:var(--logo-m)}
.p-foot{display:flex;justify-content:center;padding:24px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.th-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text)}
.th-card:hover{border-color:var(--line-strong)}
.th-card.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.th-sw{height:52px;width:100%;border-radius:6px;display:flex;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.th-bar{width:22%}
.th-body{flex:1;padding:6px;display:flex;flex-direction:column;gap:4px}
.th-body i{display:block;width:100%;height:9px;border-radius:3px;border:1px solid transparent}
.th-body i:first-child{height:16px}
.th-name{font-size:12px;font-weight:500;padding:0 2px;width:100%}
.th-name small{font:500 10px var(--mono);color:var(--text-3);margin-left:2px}
.side .p-menu .pop.side-pop{position:fixed;left:12px;bottom:64px;top:auto;right:auto;z-index:70;max-height:calc(100vh - 90px);overflow-y:auto}

.brand-ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:1100px){.brand-ed{grid-template-columns:minmax(0,1fr)}}
@container portal (max-width:900px){.brand-ed{grid-template-columns:minmax(0,1fr)}}
.be-main{display:flex;flex-direction:column;gap:26px;min-width:0}
.be-sec{gap:10px}
.be-sec h2{font-size:16px}
.be-sec > p{font-size:13px}
.drop{border:1.5px dashed var(--line-strong);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--text-2);background:var(--surface);transition:border-color .12s,background .12s}
.drop:hover,.drop.on{border-color:var(--text-3);background:var(--hover)}
.found{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sw-row{display:flex;flex-wrap:wrap;gap:8px}
.sw-lg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px 5px 5px;font-size:12px;color:var(--text)}

@container portal (max-width:640px){.logo-slots{grid-template-columns:1fr}}
.logo-slot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

.logo-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.logo-meta label.btn{cursor:pointer}
.be-prev{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.mock{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:var(--sans)}
.mock-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}

.mock-top .logo{height:18px}
.mock-body{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mock-body b{font-size:15px}
.mock-img{width:100%;height:70px;border-radius:8px;background:linear-gradient(135deg,var(--surface-2),var(--line-strong))}
.mock-acts{display:flex;gap:8px;width:100%}
.mock-acts .btn{flex:1;pointer-events:none}
.mock-foot{display:flex;justify-content:center;padding:8px;border-top:1px solid var(--line)}
.be-note{font-size:12px;color:var(--text-2);line-height:1.5}
.be-warn{font-size:12px;color:var(--st-adj);background:var(--st-adj-bg);border-radius:8px;padding:8px 10px}
.blogin{min-height:100%;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:40px 16px}
.bl-box{width:min(420px,100%);display:flex;flex-direction:column;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow)}
.bl-logo .c-logo{height:40px;max-width:240px}
.bl-logo .logo{height:28px}
.blogin h1{font-size:24px;line-height:1.2}
.bl-form{display:flex;gap:8px;flex-wrap:wrap}
.bl-form .inp{flex:1;min-width:180px;height:42px}
.bl-form .btn{height:42px}
.bl-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.p-sheet-wrap{position:absolute;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px}
.p-sheet{width:min(520px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);color:var(--text)}
@container portal (max-width:680px){.p-sheet-wrap{place-items:end center;padding:0}.p-sheet{border-radius:18px 18px 0 0}}
.ai-pop{position:absolute;z-index:12;left:50%;bottom:80px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.fn-canvas .ai-pop{bottom:auto;top:56px}
.ai-pop .pop-h b{display:inline-flex;align-items:center;gap:6px}
.ai-hint{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--text-3);line-height:1.45}
.ai-hint .ic{margin-top:2px}
.ai-att{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-att label.btn{cursor:pointer}
.ai-thumb{position:relative;display:inline-flex;align-items:center;gap:4px}
.ai-thumb img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

.side-actions .p-menu:only-child{flex:1}
.side-actions .p-menu:only-child .act-btn{width:100%}

/* ---------- v4: QG, esteira, prévias, atas ---------- */
.qg-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.qg-stat{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:0;color:var(--text)}
.qg-stat:hover{border-color:var(--line-strong)}
.qg-stat .k{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);font-weight:500}
.qg-stat .dot{width:8px;height:8px;border-radius:50%}
.qg-stat b{font:600 20px/1.1 var(--sans);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qg-stat small{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(186px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.est-col{background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:96px;outline:2px dashed transparent;outline-offset:-2px}
.est-col.over{outline-color:var(--taupe)}
.est-col.cli{background:color-mix(in srgb,var(--st-cli-bg) 60%,var(--surface-2))}
.est-col .col-h .hint .av{width:20px;height:20px;font-size:8px}
.pc-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--shadow-sm)}
.pc-card:hover{border-color:var(--line-strong)}
.pc-card.dragging{opacity:.4}
.pc-card.adj{border-color:var(--st-adj)}
.pc-card img{width:100%;height:96px;object-fit:cover;object-position:top;border-radius:6px}
.pc-card .t{font-size:13px;font-weight:500;line-height:1.3}
.pc-card .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc-card .m .av{margin-left:auto;width:22px;height:22px}
.flowbar{display:flex;flex-wrap:wrap;gap:4px}
.fb-step{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;font-size:12px;color:var(--text-3);background:var(--surface-2);border:1px solid transparent;white-space:nowrap}
.fb-step.done{color:var(--st-ok);background:var(--st-ok-bg)}
.fb-step.on{color:var(--on-primary);background:var(--primary);font-weight:600}

.lp{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}

.lp-play{position:relative;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.lp-badge{position:absolute;left:10px;top:10px;font:600 11px var(--mono);letter-spacing:.04em;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:3px 7px}
.lp-doc{position:relative;aspect-ratio:16/9;background:color-mix(in srgb,var(--tone,#888) 12%,var(--surface));display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.lp-doc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}

.lp-foot{display:flex;align-items:center;gap:8px;padding:10px 12px}
.lp-t{display:flex;flex-direction:column;min-width:0;flex:1}
.lp-t b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-t small{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--text-3);color:#fff;flex:none}
.lp-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text);min-width:0}
.lp-row:hover{background:var(--hover)}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.addlink{display:flex;gap:8px;flex-wrap:wrap}
.addlink .inp{flex:1;min-width:200px}
.addlink label.btn{cursor:pointer}
.docs-card{padding:12px;display:flex;flex-direction:column;gap:10px}
.drive-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drive-files{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px;max-height:280px;overflow:auto}
.docs-list{display:flex;flex-direction:column}
.doc-btn{border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}
.qg-list{padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ql-h{display:flex;align-items:center;gap:8px}

.sed{display:flex;flex-direction:column;gap:10px}
.script-blocks{gap:18px}

.tpl-empty{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.tpl-pick{display:flex;flex-direction:column;gap:16px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tpl-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer}

.fnp-q{height:32px;font-size:13px;flex:none}

.fmt-chip:hover{border-color:var(--text-3);color:var(--text)}
.fmt-chip small{font:500 10.5px var(--mono);color:var(--text-3)}
.fmt-chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.fmt-chip.on small{color:inherit;opacity:.75}
.pv-stage{background:var(--media-bg);border-radius:12px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;transition:box-shadow .12s}
.pv-stage.on{box-shadow:inset 0 0 0 2px #DFD0B8}
.pv-stage .slider{width:100%;max-width:276px}
.pv-stage.r916 .slider{max-width:232px}
.pv-stage.r169 .slider{max-width:100%}
.pv-stage .dots{flex-wrap:wrap;justify-content:center;max-width:100%}
.slider video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.pv-safe{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.55);pointer-events:none}
.pv-safe.t{top:13%}.pv-safe.b{bottom:13%}
.pv-drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;color:#C9C2B6;border:1.5px dashed rgba(223,208,184,.35);border-radius:10px;cursor:pointer;font-size:12.5px}
.pv-drop b{color:#F4EBDD;font-size:14px;font-weight:600;line-height:1.35;text-wrap:balance}
.pv-drop:hover,.pv-drop.on{border-color:#DFD0B8;background:rgba(223,208,184,.07)}
.pv-link{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px;background:var(--surface);color:var(--text)}
.pv-link p{font-size:12px;color:var(--text-3);line-height:1.45}
.pv-thumbs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 2px 4px}
.pv-th{position:relative;width:42px;height:52px;border-radius:6px;overflow:hidden;flex:none;border:2px solid transparent;background:#30353D;cursor:grab;padding:0}
.pv-th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pv-th.on{border-color:#DFD0B8}
.pv-th.over{border-color:#86A8FF}
.pv-th .n{position:absolute;left:2px;bottom:2px;font:600 9px/1.4 var(--mono);color:#FFFFFF;background:rgba(0,0,0,.6);border-radius:4px;padding:0 3px}
.pv-th .x{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;border:0;background:rgba(0,0,0,.72);color:#FFFFFF;font-size:12px;line-height:16px;padding:0;opacity:0;cursor:pointer}
.pv-th:hover .x,.pv-th:focus-within .x{opacity:1}
@media (hover:none){.pv-th .x{opacity:1}}
.pv-th.add{display:grid;place-items:center;border:1.5px dashed rgba(223,208,184,.4);background:none;color:#DFD0B8;cursor:pointer}
.pv-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pv-stage .btn{background:#2A3039;border-color:#48505A;color:#F2F0EF}
.pv-stage .btn:hover{background:#343A43}
.pv-stage .btn.pri{background:#DFD0B8;border-color:#DFD0B8;color:#222831}
.pv-stage label.btn{cursor:pointer}
.pv-stage .pv-link .btn{background:var(--surface);border-color:transparent;color:var(--text)}
.pv-linkin{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.pv-linkin .inp{flex:1;min-width:150px;height:32px;font-size:13px;background:#2A3039;border-color:#48505A;color:#F2F0EF}
.pv-busy{font-size:12.5px;color:#F2F0EF;text-align:center}
.pv-err{font-size:12px;color:#F2AE9F;text-align:center;line-height:1.45}
.pv-note{font-size:11.5px;color:#ABA497;text-align:center;line-height:1.45;max-width:290px}
.fmt-warn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;font-size:12.5px;line-height:1.4;color:#F4E6CC;background:rgba(234,196,127,.14);border:1px solid rgba(234,196,127,.35);border-radius:10px;padding:8px 10px}
.fmt-warn span{flex:1;min-width:150px}
.thumb-fmt{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;background:rgba(21,25,31,.74);color:#F2F0EF;font:500 11px var(--mono)}
.ap-media.r916 .slider{width:min(300px,calc(100% - 32px))}
.ap-media.r169 .slider{width:calc(100% - 32px)}

const PERM = { socio: new Set(['client.create', 'client.invite', 'people.invite', 'people.role', 'delete']), colab: new Set([]) };

/* ================= contexto ================= */
const Ctx = createContext();
const useApp = () => useContext(Ctx);

function personName(db, id) { if (id === 'client') return 'Cliente'; const p = db.people.find(x => x.id === id); return p ? p.name : '—'; }
function firstName(db, id) { return personName(db, id).split(' ')[0]; }
function itemOf(db, k, id) { return (k === 'task' ? db.tasks : k === 'post' ? db.posts : db.scripts).find(x => x.id === id); }

/* ================= peças pequenas ================= */
function Av({ id, lg }) {
  const { db } = useApp();
  if (id === 'client') return html`<span class=${cx('av', lg && 'lg')} title="Cliente"><${Icon} n="building" s=${12} /></span>`;
  const p = db.people.find(x => x.id === id);
  return html`<span class=${cx('av', lg && 'lg')} title=${p ? p.name : 'Sem responsável'}>${p ? p.ini : '—'}</span>`;
}
function CMark({ c, lg }) {
  if (c.id === 'mo') return html`<span class=${cx('cmark', lg && 'lg')} dangerouslySetInnerHTML=${{ __html: ICON }}></span>`;
  return html`<span class=${cx('cmark', lg && 'lg')}>${initials(c.name)}</span>`;
}
function CChip({ id }) {
  const { db } = useApp(); const c = db.clients.find(x => x.id === id); if (!c) return null;
  return html`<span class="cchip"><${CMark} c=${c} />${c.name}</span>`;
}
function Due({ date, done }) {
  if (!date) return html`<span class="due">sem prazo</span>`;
  const n = diff(date);
  if (!done && n < 0) return html`<span class="due late">atrasada ${plural(-n, 'dia')}</span>`;
  return html`<span class="due">${n === 0 ? 'hoje' : n === 1 ? 'amanhã' : fmt(date)}</span>`;
}
function Logo({ h }) { return html`<span class="logo" style=${h ? { height: h + 'px' } : null} dangerouslySetInnerHTML=${{ __html: LOGO }}></span>`; }
function PageHead({ title, sub, children }) {
  return html`<div class="phead"><div><h1>${title}</h1>${sub && html`<p class="sub">${sub}</p>`}</div>${children && html`<div class="acts">${children}</div>`}</div>`;
}
function Mentions({ text }) {
  return text.split(/(@[A-Za-zÀ-ú]+)/g).map((s, i) => s.startsWith('@') ? html`<span class="mention" key=${i}>${s}</span>` : s);
}

/* ================= visão geral ================= */
function stuckOf(db) {
  const out = [];
  db.tasks.forEach(t => {
    if (t.status === 'done') return;
    const s = -diff(t.since);
    if (t.due && diff(t.due) < 0) out.push({ k: 'task', x: t, n: -diff(t.due), why: `Atrasada ${plural(-diff(t.due), 'dia')}`, tone: 'late' });
    else if (t.status === 'client' && s >= 3) out.push({ k: 'task', x: t, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (t.status === 'review' && s >= 5) out.push({ k: 'task', x: t, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  [...db.posts.map(x => ['post', x]), ...db.scripts.map(x => ['script', x])].forEach(([k, x]) => {
    const s = -diff(x.since);
    if (x.status === 'cliente' && s >= 3) out.push({ k, x, n: s, why: `Esperando o cliente há ${s} dias`, tone: 'cli', remind: true });
    else if (x.status === 'ajuste') out.push({ k, x, n: s + 1, why: `Ajuste pedido ${rel(x.since)}`, tone: 'adj' });
    else if (x.status === 'revisao' && s >= 5) out.push({ k, x, n: s, why: `Parada em revisão há ${s} dias`, tone: 'prog' });
  });
  return out.sort((a, b) => b.n - a.n);
}
function Overview() {

  const stuck = stuckOf(db);
